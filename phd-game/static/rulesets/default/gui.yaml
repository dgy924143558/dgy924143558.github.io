---
statsBar:
  items:
  - text: ui.hopeMeter
    side: left
    updateTrigger:
      variables: ["player.hope"]
    conditionalStyles:
    - condition: player.hope > 40
      styleClasses: ["normal"]
    - condition: player.hope <= 40 && player.hope > 20
      styleClasses: ["warning"]
    - condition: player.hope <= 20
      styleClasses: ["critical"]
  - text: ui.timeMeter
    side: right
    updateTrigger:
      variables: ["year", "month"]
messageWindow:
  typewriterSpeed: 30
itemList:
  title: ui.items
  raritySpecificStyles:
    - minRarity: 10
      styleClasses: ["r_legendary"]
    - minRarity: 6
      maxRarity: 9
      styleClasses: ["r_rare"]
    - minRarity: 3
      maxRarity: 5
      styleClasses: ["r_uncommon"]
statusList:
  title: ui.status
footer:
  preamble:
buttons:
    # 日语版链接 (你的翻译版本)
    - text: "(Japanese Version)Github"
      url: https://dgy924143558.github.io/phd-game/dist/index.html

    # 原版链接 (原始项目)
    - text: "(Original Version)Github"
      url: https://morriswmz.github.io/phd-game/

    # 帮助按钮 (保持不变)
    - text: ui.helpButton
      messageTitle: ui.helpTitle
      message: ui.helpContent
      confirmText: ui.ok

    # 隐私声明按钮 (保持不变)
    - text: ui.privacyNoticeButton
      messageTitle: ui.privacyNoticeTitle
      message: ui.privacyNoticeContent
      confirmText: ui.ok

    # 随机种子按钮 (保持不变)
    - text: ui.seedButton
      messageTitle: ui.seedTitle
      message: ui.seedContent
      confirmText: ui.ok