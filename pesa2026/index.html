<style>
  /* Layout: one lyric column (max 760px) on a full-bleed colored stage; tabs pinned top, transport bar pinned bottom.
     Single committed look: the stage color is the design in both themes, so no light/dark split. */
  :root {
    --stage-talk: #3A6BA5;
    --stage-chair: #2D7769;
    --stage: var(--stage-talk);
    --now: #FFFFFF;
    --past: rgba(255, 255, 255, 0.68);
    --next: rgba(10, 20, 34, 0.86);
    --chip: rgba(255, 255, 255, 0.18);
    --shade: rgba(0, 0, 0, 0.16);
    --bar: #101722;
    --bar-2: #1A2230;
    --bar-fg: #EEF2F7;
    --bar-dim: #A3AEBD;
    --bar-line: #2A3546;
    --amber: #F5B841;
    --amber-ink: #1D1607;
    --font: "Figtree", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --barH: 112px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--stage);
    color: var(--now);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.6s ease;
  }
  body[data-tab="chair"] { --stage: var(--stage-chair); }
  .gutter {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  button, select, input { font-family: var(--font); }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  /* top */
  .top {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--stage);
    box-shadow: 0 14px 18px -6px var(--stage);
    padding-block: 14px 10px;
    transition: background-color 0.6s ease, box-shadow 0.6s ease;
  }
  .top-in {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .brand b { font-size: 15px; font-weight: 800; letter-spacing: 0.02em; }
  .brand span { font-size: 12px; font-weight: 600; color: var(--past); }
  .tabs { display: flex; gap: 4px; background: var(--shade); padding: 4px; border-radius: 999px; }
  .tab {
    border: 0;
    background: transparent;
    color: var(--past);
    font-weight: 700;
    font-size: 14px;
    line-height: 1;
    padding: 9px 14px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab small { font-weight: 600; opacity: 0.8; margin-left: 6px; font-size: 12px; }
  .tab[aria-selected="true"] { background: var(--now); color: var(--stage); }
  .hint { max-width: 760px; margin: 8px auto 0; font-size: 13px; color: var(--past); }
  .voices { max-width: 760px; margin: 10px auto 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; font-weight: 700; color: var(--past); }
  .vchips { display: flex; gap: 6px; flex-wrap: wrap; }
  .vchip {
    border: 0;
    background: var(--shade);
    color: var(--past);
    font-weight: 700;
    font-size: 13px;
    line-height: 1;
    padding: 8px 13px;
    border-radius: 999px;
    cursor: pointer;
  }
  .vchip[aria-pressed="true"] { background: var(--now); color: var(--stage); }
  .vchip.unavail { background: transparent; box-shadow: inset 0 0 0 1px var(--past); opacity: 0.7; }
  .vchip.unavail[aria-pressed="true"] { background: var(--shade); color: var(--now); opacity: 1; }
  .legend { font-weight: 600; }
  .legend u { text-decoration-color: var(--amber); text-decoration-thickness: 3px; text-underline-offset: 4px; }
  .pause { opacity: 0.5; font-weight: 600; padding: 0 0.08em; }
  .w.em {
    text-decoration: underline;
    text-decoration-color: var(--amber);
    text-decoration-thickness: 3px;
    text-underline-offset: 6px;
  }
  .hint kbd {
    font-family: var(--font);
    font-size: 12px;
    font-weight: 700;
    background: var(--shade);
    border-radius: 5px;
    padding: 1px 6px;
  }
  .banner {
    max-width: 760px;
    margin: 10px auto 0;
    background: var(--bar);
    color: var(--bar-fg);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
  }

  /* lyrics */
  .lyrics {
    max-width: 760px;
    margin: 0 auto;
    padding-block: 18px calc(var(--barH) + 38vh);
    display: flex;
    flex-direction: column;
    gap: 44px;
  }
  .group { display: flex; flex-direction: column; gap: 4px; }
  .ghead { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
  .glabel { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--past); }
  .gtitle { margin: 0; font-size: 16px; font-weight: 700; color: var(--past); text-wrap: balance; }
  .gnote {
    margin: 0;
    align-self: flex-start;
    max-width: 100%;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.5;
    color: var(--now);
    background: var(--shade);
    padding: 6px 10px;
    border-radius: 8px;
  }
  .line { padding-block: 8px; cursor: pointer; min-width: 0; }
  .text {
    margin: 0;
    font-size: clamp(22px, 1.6vw + 15px, 34px);
    font-weight: 800;
    line-height: 1.28;
    letter-spacing: -0.01em;
    color: var(--next);
    overflow-wrap: anywhere;
    transition: color 0.35s ease;
  }
  .line.past .text { color: var(--past); }
  .line.now .text { color: var(--now); }
  .line.next:hover .text { color: rgba(255, 255, 255, 0.9); }
  .w { transition: opacity 0.15s linear; }
  .line.now.speaking .w { opacity: 0.6; }
  .line.now.speaking .w.lit { opacity: 1; }
  .mini { display: flex; align-items: center; gap: 10px; margin-top: 8px; opacity: 0.6; transition: opacity 0.35s ease; }
  .line.now .mini { opacity: 1; }
  .mplay {
    flex: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 0;
    background: var(--chip);
    color: var(--now);
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .line.now .mplay { background: var(--now); color: var(--stage); }
  .mplay svg { width: 12px; height: 12px; }
  .track { flex: 1; max-width: 320px; height: 4px; background: rgba(255, 255, 255, 0.24); border-radius: 2px; overflow: hidden; }
  .fill { height: 100%; width: 100%; background: var(--now); transform-origin: left center; transform: scaleX(0); }
  .time { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--past); min-width: 76px; }

  /* follow button */
  .follow {
    position: fixed;
    right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(var(--barH) + 16px);
    z-index: 9;
    border: 0;
    border-radius: 999px;
    background: var(--now);
    color: var(--stage);
    font-weight: 700;
    font-size: 14px;
    padding: 10px 16px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
  }

  /* transport bar */
  .bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    background: var(--bar);
    color: var(--bar-fg);
    border-top: 1px solid var(--bar-line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .bar-in {
    max-width: 1120px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: 16px;
    padding-block: 12px;
  }
  .np { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .np-label { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--bar-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-text { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .transport { display: flex; align-items: center; gap: 12px; }
  .tbtn {
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 50%;
    background: none;
    color: var(--bar-fg);
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .tbtn:hover { background: var(--bar-2); }
  .tbtn svg { width: 18px; height: 18px; }
  .tbtn.play { width: 50px; height: 50px; background: var(--bar-fg); color: var(--bar); }
  .tbtn.play:hover { background: #FFFFFF; }
  .tbtn.play svg { width: 20px; height: 20px; }
  .tools { display: flex; align-items: center; justify-content: flex-end; gap: 10px; min-width: 0; flex-wrap: wrap; }
  .chips { display: flex; gap: 4px; }
  .chip {
    border: 1px solid var(--bar-line);
    background: transparent;
    color: var(--bar-dim);
    font-weight: 700;
    font-size: 12px;
    line-height: 1;
    padding: 7px 8px;
    border-radius: 999px;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .chip[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); }
  #rate { width: 104px; accent-color: var(--amber); }
  .rate-out { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 44px; }
  .gear[aria-expanded="true"] { background: var(--bar-2); color: var(--amber); }
  .opts {
    max-width: 1120px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 18px;
    padding-block: 0 14px;
    font-size: 13px;
    color: var(--bar-dim);
  }
  .opts label { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .opts select {
    background: var(--bar-2);
    color: var(--bar-fg);
    border: 1px solid var(--bar-line);
    border-radius: 8px;
    padding: 6px 8px;
    font-weight: 600;
    font-size: 13px;
    max-width: 260px;
    min-width: 0;
  }
  .toggle {
    border: 1px solid var(--bar-line);
    background: transparent;
    color: var(--bar-dim);
    border-radius: 999px;
    padding: 7px 12px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .toggle[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); }
  .vhint { font-size: 12px; color: var(--bar-dim); }

  @media (max-width: 760px) {
    .bar-in { grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; padding-block: 10px; }
    .tools { grid-column: 1 / -1; justify-content: space-between; }
    .tbtn.play { width: 44px; height: 44px; }
    .transport { gap: 6px; }
    #rate { width: 84px; }
  }
  @media (max-width: 420px) {
    #rate, .rate-out { display: none; }
    .tab small { display: none; }
    .chip { padding: 7px 6px; }
  }
  @media (hover: none) {
    .hint .keys { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>

drives, the inverter is hard-switched."]},{"t":"Hard switching creates high dv/dt, and when many drives run at the same time, this switching noise adds up.","id":"talk_008","d":{"web-sg":7.59,"af_heart":7.13,"zm_yunjian":5.93},"w":["Hard switching creates high d v, d t, and when many drives run at the same time, this switching noise adds up."]},{"t":"In a hospital or a home, there is EMI-sensitive equipment nearby — for example ECG monitors, infusion pumps, blood-pressure monitors and bed sensors.","id":"talk_009","d":{"web-sg":10.21,"af_heart":10.3,"zm_yunjian":8.47},"w":["In a hospital or a home, there is EMI-sensitive equipment nearby, for example ECG monitors, infusion pumps, blood-pressure monitors and bed sensors."]},{"t":"So our goal is simple: remove the noise at its source, by making the inverter switch at zero voltage.","id":"talk_010","d":{"web-sg":6.97,"af_heart":6.23,"zm_yunjian":5.57},"w":["So our goal is simple: remove the noise at its source, by making the inverter switch at zero voltage."]}]},{"label":"SLIDE 03 · 目标 0:50","title":"Existing methods cost parts or stress","lines":[{"t":"Resonant soft switching for three-phase inverters has a long history.","id":"talk_011","d":{"web-sg":4.76,"af_heart":4.14,"zm_yunjian":3.92},"w":["Resonant soft switching for three-phase inverters has a long history."]},{"t":"Let me compare two main approaches.","id":"talk_012","d":{"web-sg":2.41,"af_heart":1.92,"zm_yunjian":2.05},"w":["Let me compare two main approaches."]},{"t":"The first is the auxiliary resonant commutated pole inverter, or ARCPI.","id":"talk_013","d":{"web-sg":4.9,"af_heart":4.5,"zm_yunjian":4.31},"w":["The first is the auxiliary resonant commutated pole inverter, or ARCPI."]},{"t":"It achieves ZVS for the main switches and ZCS for the auxiliary switches, but it needs many auxiliary components, which increases cost and loss.","id":"talk_014","d":{"web-sg":9.93,"af_heart":10.03,"zm_yunjian":8.41},"w":["It achieves ZVS for the main switches and ZCS for the auxiliary switches, but it needs many auxiliary components, which increases cost and loss."]},{"t":"The second is the resonant DC-link inverter.","id":"talk_015","d":{"web-sg":3.03,"af_heart":2.82,"zm_yunjian":2.65},"w":["The second is the resonant DC-link inverter."]},{"t":"It is simpler, with few extra switches, but its resonant current is almost the same as the load current, so the passive components see high stress.","id":"talk_016","d":{"web-sg":10.14,"af_heart":8.7,"zm_yunjian":7.42},"w":["It is simpler, with few extra switches, but its resonant current is almost the same as the load current, so the passive components see high stress."]},{"t":"Our approach adds only two switches, one inductor, one capacitor and one diode — and the circulating current stays small.","id":"talk_017","d":{"web-sg":8.28,"af_heart":7.4,"zm_yunjian":6.46},"w":["Our approach adds only two switches, one inductor, one capacitor and one diode, and the circulating current stays small."]}]},{"label":"SLIDE 04 · 目标 0:30","title":"This work moves to hardware","lines":[{"t":"This talk builds on our previous work.","id":"talk_018","d":{"web-sg":2.62,"af_heart":2.05,"zm_yunjian":2.13},"w":["This talk builds on our previous work."]},{"t":"Last year, at ITEC Asia-Pacific 2025, we proposed this circuit and verified it by simulation.","id":"talk_019","d":{"web-sg":6.55,"af_heart":7.13,"zm_yunjian":6.4},"w":["Last year, at I tech Asia-Pacific 2025, we proposed this circuit and verified it by simulation."]},{"t":"This year, we built the hardware and tested it on a 24-volt PMSM drive — this is the new contribution of today’s paper.","id":"talk_020","d":{"web-sg":8.14,"af_heart":8.23,"zm_yunjian":7.04},"w":["This year, we built the hardware and tested it on a 24-volt PMSM drive, this is the new contribution of today’s paper."]},{"t":"Next, we plan a journal version with the full evaluation.","id":"talk_021","d":{"web-sg":3.93,"af_heart":3.46,"zm_yunjian":3.2},"w":["Next, we plan a journal version with the full evaluation."]}]},{"label":"SLIDE 05 · 目标 0:45","title":"The add-on sits at the DC link","lines":[{"t":"Here is the proposed circuit.","id":"talk_022","d":{"web-sg":2,"af_heart":1.6,"zm_yunjian":1.64},"w":["Here is the proposed circuit."]},{"t":"On the right, you can see a standard three-phase inverter driving the PMSM.","id":"talk_023","d":{"web-sg":5.17,"af_heart":4.39,"zm_yunjian":4.03},"w":["On the right, you can see a standard three-phase inverter driving the PMSM."]},{"t":"On the left is our auxiliary circuit.","id":"talk_024","d":{"web-sg":2.55,"af_heart":2.18,"zm_yunjian":2.09},"w":["On the left is our auxiliary circuit."]},{"t":"The bus switch, S-bus, connects or disconnects the inverter from the DC source.","id":"talk_025","d":{"web-sg":5.45,"af_heart":4.82,"zm_yunjian":4.33},"w":["The bus switch, S-bus, connects or disconnects the inverter from the DC source."]},{"t":"The auxiliary switch S-aux, the resonant inductor Lr and the resonant capacitor Cr form a resonant branch.","id":"talk_026","d":{"web-sg":7.45,"af_heart":7.4,"zm_yunjian":6.49},"w":["The auxiliary switch S-aux, the resonant inductor L r and the resonant capacitor C r form a resonant branch."]},{"t":"The diode Da clamps the capacitor voltage.","id":"talk_027","d":{"web-sg":2.97,"af_heart":2.82,"zm_yunjian":2.62},"w":["The diode D a clamps the capacitor voltage."]},{"t":"The key point is that the three-phase bridge itself is not changed at all.","id":"talk_028","d":{"web-sg":5.1,"af_heart":4.18,"zm_yunjian":3.86},"w":["The key point is that the three-phase bridge itself is not changed at all."]},{"t":"The auxiliary circuit is simply added at the DC link.","id":"talk_029","d":{"web-sg":3.66,"af_heart":3.33,"zm_yunjian":3.35},"w":["The auxiliary circuit is simply added at the DC link."]}]},{"label":"SLIDE 06 · 目标 1:05","title":"Switch only when the link is at zero","lines":[{"t":"Now, how does it work?","id":"talk_030","d":{"web-sg":1.52,"af_heart":1.32,"zm_yunjian":1.3},"w":["Now, how does it work?"]},{"t":"The idea can be explained in three steps.","id":"talk_031","d":{"web-sg":2.83,"af_heart":2.35,"zm_yunjian":2.39},"w":["The idea can be explained in three steps."]},{"t":"Step one: disconnect.","id":"talk_032","d":{"web-sg":1.45,"af_heart":1.47,"zm_yunjian":1.34},"w":["Step one: disconnect."]},{"t":"S-bus turns off.","id":"talk_033","d":{"web-sg":1.2,"af_heart":1.24,"zm_yunjian":1.24},"w":["S-bus turns off."]},{"t":"The inverter is separated from the source, the DC-link capacitance discharges, and the link voltage falls to almost zero.","id":"talk_034","d":{"web-sg":8.34,"af_heart":7.57,"zm_yunjian":6.66},"w":["The inverter is separated from the source, the DC-link capacitance discharges, and the link voltage falls to almost zero."]},{"t":"Step two: commutate.","id":"talk_035","d":{"web-sg":1.38,"af_heart":1.49,"zm_yunjian":1.41},"w":["Step two: commutate."]},{"t":"While the link voltage is zero, the bridge switches change their state.","id":"talk_036","d":{"web-sg":4.9,"af_heart":3.78,"zm_yunjian":3.58},"w":["While the link voltage is zero, the bridge switches change their state."]},{"t":"Because there is no voltage across them, they turn on under zero-voltage switching.","id":"talk_037","d":{"web-sg":5.72,"af_heart":4.67,"zm_yunjian":4.48},"w":["Because there is no voltage across them, they turn on under zero-voltage switching."]},{"t":"Step three: restore.","id":"talk_038","d":{"web-sg":1.38,"af_heart":1.37,"zm_yunjian":1.26},"w":["Step three: restore."]},{"t":"S-aux turns on, Lr and Cr resonate, and the link is recharged to the input voltage.","id":"talk_039","d":{"web-sg":5.86,"af_heart":6.12,"zm_yunjian":5.5},"w":["S-aux turns on, L r and C r resonate, and the link is recharged to the input voltage."]},{"t":"Then S-bus turns on again — also at zero voltage.","id":"talk_040","d":{"web-sg":3.31,"af_heart":3.29,"zm_yunjian":3.18},"w":["Then S-bus turns on again, also at zero voltage."]},{"t":"After this, only a small circulating current remains — about one-tenth to one-hundredth of the input current — so the extra loss is small.","id":"talk_041","d":{"web-sg":9.38,"af_heart":8.3,"zm_yunjian":7.3},"w":["After this, only a small circulating current remains, about one-tenth to one-hundredth of the input current, so the extra loss is small."]},{"t":"The figure on the right shows the theoretical waveforms over the seven operating modes.","id":"talk_042","d":{"web-sg":6,"af_heart":5.01,"zm_yunjian":4.69},"w":["The figure on the right shows the theoretical waveforms over the seven operating modes."]}]},{"label":"SLIDE 07 · 目标 0:35","title":"Control plugs into standard FOC","lines":[{"t":"The control is also modular.","id":"talk_043","d":{"web-sg":1.93,"af_heart":1.86,"zm_yunjian":1.92},"w":["The control is also modular."]},{"t":"We keep the standard field-oriented control — the speed and current PI loops, and the Clarke and Park transforms — exactly as it is.","id":"talk_044","d":{"web-sg":9.03,"af_heart":8.15,"zm_yunjian":6.81},"w":["We keep the standard field-oriented control, the speed and current P I loops, and the Clarke and Park transforms, exactly as it is."]},{"t":"We only add one block after the PWM output.","id":"talk_045","d":{"web-sg":2.97,"af_heart":3.24,"zm_yunjian":3.14},"w":["We only add one block after the PWM output."]},{"t":"This block uses six flip-flops to follow the switching edges of S1 to S6, and it generates short notch pulses for S-bus and S-aux.","id":"talk_046","d":{"web-sg":9.1,"af_heart":8.94,"zm_yunjian":7.81},"w":["This block uses six flip-flops to follow the switching edges of S 1 to S 6, and it generates short notch pulses for S-bus and S-aux."]},{"t":"So the method can be added to an existing FOC drive.","id":"talk_047","d":{"web-sg":3.72,"af_heart":3.39,"zm_yunjian":3.18},"w":["So the method can be added to an existing F O C drive."]}]},{"label":"SLIDE 08 · 目标 0:40","title":"Simulation showed ZVS on every switch","lines":[{"t":"This slide summarizes last year’s simulation, at a switching frequency of 15 kilohertz.","id":"talk_048","d":{"web-sg":6,"af_heart":5.55,"zm_yunjian":5.16},"w":["This slide summarizes last year’s simulation, at a switching frequency of 15 kilohertz."]},{"t":"The main switch S1 achieved ZVS turn-on and ZCS turn-off.","id":"talk_049","d":{"web-sg":4,"af_heart":4.67,"zm_yunjian":4.27},"w":["The main switch S 1 achieved ZVS turn-on and ZCS turn-off."]},{"t":"Both auxiliary switches, S-bus and S-aux, achieved ZVS turn-on.","id":"talk_050","d":{"web-sg":4.34,"af_heart":4.76,"zm_yunjian":4.27},"w":["Both auxiliary switches, S-bus and S-aux, achieved ZVS turn-on."]},{"t":"At the bottom, the three-phase output current is smooth, with low distortion.","id":"talk_051","d":{"web-sg":5.31,"af_heart":4.31,"zm_yunjian":3.97},"w":["At the bottom, the three-phase output current is smooth, with low distortion."]},{"t":"However, this was only a simulation.","id":"talk_052","d":{"web-sg":2.48,"af_heart":2.15,"zm_yunjian":2.13},"w":["However, this was only a simulation."]},{"t":"The open question was: does it also work on real hardware?","id":"talk_053","d":{"web-sg":4,"af_heart":3.63,"zm_yunjian":3.35},"w":["The open question was: does it also work on real hardware?"]},{"t":"That is what we answer this year.","id":"talk_054","d":{"web-sg":2.28,"af_heart":1.75,"zm_yunjian":1.66},"w":["That is what we answer this year."]}]},{"label":"SLIDE 09 · 目标 0:50","title":"The prototype adds one sub-board","lines":[{"t":"So this year, we built a prototype.","id":"talk_055","d":{"web-sg":2.41,"af_heart":2.09,"zm_yunjian":1.96},"w":["So this year, we built a prototype."]},{"t":"The main inverter is a TI DRV8353Rx evaluation board, and the controller is a LAUNCHXL-F28027F microcontroller running InstaSPIN-FOC.","id":"talk_056","d":{"web-sg":10.62,"af_heart":14.1,"zm_yunjian":11.35},"w":["The main inverter is a TI D R V 8 3 5 3 R x evaluation board, and the controller is a Launch X L, F 2 8 0 2 7 F microcontroller running Insta Spin, F O C."]},{"t":"Our auxiliary circuit is built on a separate sub-board and connected to the DC link.","id":"talk_057","d":{"web-sg":5.79,"af_heart":4.91,"zm_yunjian":4.71},"w":["Our auxiliary circuit is built on a separate sub-board and connected to the DC link."]},{"t":"It uses two 100-volt silicon MOSFETs, a 0.15-microhenry inductor and a 0.1-microfarad capacitor.","id":"talk_058","d":{"web-sg":6.62,"af_heart":8.81,"zm_yunjian":7.49},"w":["It uses two 100-volt silicon MOSFETs, a 0.15-microhenry inductor and a 0.1-microfarad capacitor."]},{"t":"The same microcontroller drives the auxiliary switches, synchronized with the PWM, and the main bridge is not modified.","id":"talk_059","d":{"web-sg":8.21,"af_heart":7.98,"zm_yunjian":7.04},"w":["The same microcontroller drives the auxiliary switches, synchronized with the PWM, and the main bridge is not modified."]},{"t":"The DC-link voltage is 24 volts, the switching frequency is 20 kilohertz, and the load is a 24-volt PMSM with 14 pole pairs.","id":"talk_060","d":{"web-sg":8.55,"af_heart":10.22,"zm_yunjian":8.81},"w":["The DC-link voltage is 24 volts, the switching frequency is 20 kilohertz, and the load is a 24-volt PMSM with 14 pole pairs."]}]},{"label":"SLIDE 10 · 目标 0:50","title":"Gate timing follows the design","lines":[{"t":"For the evaluation, we selected the transition from V1 to V2, shown here on the space-vector hexagon.","id":"talk_061","d":{"web-sg":7.1,"af_heart":6.89,"zm_yunjian":6.12},"w":["For the evaluation, we selected the transition from V 1 to V 2, shown here on the space-vector hexagon."]},{"t":"It is a typical active-vector change during PMSM operation.","id":"talk_062","d":{"web-sg":4.07,"af_heart":4.18,"zm_yunjian":3.84},"w":["It is a typical active-vector change during PMSM operation."]},{"t":"The oscilloscope capture shows the measured gate signals of S-bus, S-aux and the main switch S1.","id":"talk_063","d":{"web-sg":6.69,"af_heart":6.12,"zm_yunjian":5.48},"w":["The oscilloscope capture shows the measured gate signals of S-bus, S-aux and the main switch S 1."]},{"t":"The sequence is: first, S-bus turns off.","id":"talk_064","d":{"web-sg":2.76,"af_heart":2.82,"zm_yunjian":2.41},"w":["The sequence is: first, S-bus turns off."]},{"t":"Then S1 turns on.","id":"talk_065","d":{"web-sg":1.24,"af_heart":1.51,"zm_yunjian":1.47},"w":["Then S 1 turns on."]},{"t":"Next, S-aux turns on.","id":"talk_066","d":{"web-sg":1.45,"af_heart":1.64,"zm_yunjian":1.54},"w":["Next, S-aux turns on."]},{"t":"Finally, S-bus turns on again.","id":"talk_067","d":{"web-sg":2.07,"af_heart":2.11,"zm_yunjian":1.94},"w":["Finally, S-bus turns on again."]},{"t":"The whole sequence fits in a window of about 330 nanoseconds.","id":"talk_068","d":{"web-sg":4.21,"af_heart":4.18,"zm_yunjian":4.01},"w":["The whole sequence fits in a window of about 330 nanoseconds."]},{"t":"This confirms that the three switches are coordinated in hardware, exactly as designed.","id":"talk_069","d":{"web-sg":6,"af_heart":5.33,"zm_yunjian":4.95},"w":["This confirms that the three switches are coordinated in hardware, exactly as designed."]}]},{"label":"SLIDE 11 · 目标 0:45","title":"Resonance pulls the DC link near zero","lines":[{"t":"Here are the measured commutation waveforms.","id":"talk_070","d":{"web-sg":3.03,"af_heart":2.37,"zm_yunjian":2.39},"w":["Here are the measured commutation waveforms."]},{"t":"When S-bus turns off and S-aux is activated, Lr and Cr start to resonate.","id":"talk_071","d":{"web-sg":5.17,"af_heart":5.38,"zm_yunjian":4.95},"w":["When S-bus turns off and S-aux is activated, L r and C r start to resonate."]},{"t":"As a result, the inverter DC-link voltage, v-inv, drops quickly and forms a short low-voltage interval, close to zero.","id":"talk_072","d":{"web-sg":8.14,"af_heart":7.96,"zm_yunjian":6.74},"w":["As a result, the inverter DC-link voltage, v inv, drops quickly and forms a short low-voltage interval, close to zero."]},{"t":"At the same time, the capacitor voltage and the inductor current show the resonant energy exchange.","id":"talk_073","d":{"web-sg":6.83,"af_heart":6.04,"zm_yunjian":5.29},"w":["At the same time, the capacitor voltage and the inductor current show the resonant energy exchange."]},{"t":"This tells us that the auxiliary branch directly takes part in the commutation, and that it creates the low-voltage condition needed for soft switching.","id":"talk_074","d":{"web-sg":10.48,"af_heart":8.64,"zm_yunjian":7.89},"w":["This tells us that the auxiliary branch directly takes part in the commutation, and that it creates the low-voltage condition needed for soft switching."]}]},{"label":"SLIDE 12 · 目标 0:55","title":"The aux branch suppresses ringing","lines":[{"t":"This is the key result of the paper.","id":"talk_075","d":{"web-sg":2.48,"af_heart":1.98,"zm_yunjian":1.96},"w":["This is the key result of the paper."]},{"t":"To see the effect of the auxiliary branch, we compared two cases.","id":"talk_076","d":{"web-sg":4.48,"af_heart":3.88,"zm_yunjian":3.71},"w":["To see the effect of the auxiliary branch, we compared two cases."]},{"t":"On the left, both S-bus and S-aux operate, as proposed.","id":"talk_077","d":{"web-sg":3.79,"af_heart":3.67,"zm_yunjian":3.29},"w":["On the left, both S-bus and S-aux operate, as proposed."]},{"t":"The DC-link voltage makes a smooth transition, with no visible ringing.","id":"talk_078","d":{"web-sg":4.9,"af_heart":4.35,"zm_yunjian":4.25},"w":["The DC-link voltage makes a smooth transition, with no visible ringing."]},{"t":"On the right, we disabled S-aux and operated S-bus only.","id":"talk_079","d":{"web-sg":3.86,"af_heart":3.75,"zm_yunjian":3.46},"w":["On the right, we disabled S-aux and operated S-bus only."]},{"t":"Now you can see strong high-frequency ringing right after the voltage transition.","id":"talk_080","d":{"web-sg":5.59,"af_heart":4.65,"zm_yunjian":4.37},"w":["Now you can see strong high-frequency ringing right after the voltage transition."]},{"t":"The only difference between the two cases is the auxiliary branch.","id":"talk_081","d":{"web-sg":4.55,"af_heart":3.78,"zm_yunjian":3.65},"w":["The only difference between the two cases is the auxiliary branch."]},{"t":"So the resonant branch provides a controlled commutation path and suppresses the switching oscillation.","id":"talk_082","d":{"web-sg":7.1,"af_heart":5.85,"zm_yunjian":5.46},"w":["So the resonant branch provides a controlled commutation path and suppresses the switching oscillation."]},{"t":"This is our experimental evidence that the soft-switching scheme works.","id":"talk_083","d":{"web-sg":4.9,"af_heart":3.97,"zm_yunjian":3.63},"w":["This is our experimental evidence that the soft-switching scheme works."]}]},{"label":"SLIDE 13 · 目标 0:45","title":"Mechanism confirmed, numbers next","lines":[{"t":"To conclude.","id":"talk_084","d":{"web-sg":1.2,"af_heart":1,"zm_yunjian":0.96},"w":["To conclude."]},{"t":"We extended our parallel-resonant DC-link approach from simulation to hardware, on a 24-volt PMSM drive.","id":"talk_085","d":{"web-sg":7.17,"af_heart":8.06,"zm_yunjian":7.04},"w":["We extended our parallel-resonant DC-link approach from simulation to hardware, on a 24-volt PMSM drive."]},{"t":"We confirmed three points: the coordinated switching sequence, the low-voltage interval created by the resonant branch, and clear ringing suppression.","id":"talk_086","d":{"web-sg":10.34,"af_heart":8.66,"zm_yunjian":7.32},"w":["We confirmed three points: the coordinated switching sequence, the low-voltage interval created by the resonant branch, and clear ringing suppression."]},{"t":"There are also limitations.","id":"talk_087","d":{"web-sg":1.86,"af_heart":1.6,"zm_yunjian":1.62},"w":["There are also limitations."]},{"t":"The waveforms are slightly rounded, because the parameters are not yet optimized, and we have not yet measured loss, efficiency and EMI.","id":"talk_088","d":{"web-sg":9.38,"af_heart":8.45,"zm_yunjian":7.32},"w":["The waveforms are slightly rounded, because the parameters are not yet optimized, and we have not yet measured loss, efficiency and EMI."]},{"t":"These, together with the full ZVS range, will be covered in our journal version.","id":"talk_089","d":{"web-sg":5.52,"af_heart":4.78,"zm_yunjian":4.37},"w":["These, together with the full ZVS range, will be covered in our journal version."]}]},{"label":"SLIDE 14 · 目标 0:10","title":"Thank you — questions welcome","lines":[{"t":"Thank you very much for your attention.","id":"talk_090","d":{"web-sg":2.69,"af_heart":1.9,"zm_yunjian":1.94},"w":["Thank you very much for your attention."]},{"t":"I’m happy to take your questions.","id":"talk_091","d":{"web-sg":2.28,"af_heart":1.79,"zm_yunjian":1.83},"w":["I’m happy to take your questions."]}]}],"keynote":[{"label":"SLIDE 01 · 目标 0:25","title":"Title slide","lines":[{"t":"Good afternoon, everyone.","id":"keynote_000","d":{"web-sg":1.72,"af_heart":1.51,"zm_yunjian":1.42},"w":["Good afternoon, everyone."]},{"t":"My name is Guiyi Dong. | I’m from Toyota’s Frontier Research Center.","id":"keynote_001","d":{"web-sg":4.97,"af_heart":4.14,"zm_yunjian":3.99},"w":["My name is Guiyi Dong.","I’m from Toyota’s Frontier Research Center."]},{"t":"Today, | I want to share *one simple idea*.","id":"keynote_002","d":{"web-sg":3.11,"af_heart":2.8,"zm_yunjian":2.81},"w":["Today,","I want to share one simple idea."]},{"t":"Switch | *only when the voltage is zero*.","id":"keynote_003","d":{"web-sg":2.97,"af_heart":2.89,"zm_yunjian":2.85},"w":["Switch","only when the voltage is zero."]},{"t":"This is joint work with Yoh Sato and Yoshihiro Okumatsu.","id":"keynote_004","d":{"web-sg":3.86,"af_heart":3.62,"zm_yunjian":3.53},"w":["This is joint work with Yoh Sato and Yoshihiro Okumatsu."]}]},{"label":"SLIDE 02 · 目标 0:55","title":"Robot drives multiply switching noise","lines":[{"t":"Let’s start with robots.","id":"keynote_005","d":{"web-sg":1.66,"af_heart":1.35,"zm_yunjian":1.42},"w":["Let’s start with robots."]},{"t":"Robots are moving into *hospitals*. | Into *homes*.","id":"keynote_006","d":{"web-sg":3.52,"af_heart":3.22,"zm_yunjian":3.41},"w":["Robots are moving into hospitals.","Into homes."]},{"t":"One robot can have *dozens* of motors.","id":"keynote_007","d":{"web-sg":2.48,"af_heart":2.2,"zm_yunjian":2.27},"w":["One robot can have dozens of motors."]},{"t":"Every motor has its own inverter. | And most of them | are *hard-switched*.","id":"keynote_008","d":{"web-sg":5.6,"af_heart":4.77,"zm_yunjian":4.77},"w":["Every motor has its own inverter.","And most of them","are hard-switched."]},{"t":"Hard switching means high *dv/dt*.","id":"keynote_009","d":{"web-sg":2.41,"af_heart":2.35,"zm_yunjian":2.3},"w":["Hard switching means high d v, d t."]},{"t":"And that noise | *adds up*.","id":"keynote_010","d":{"web-sg":2.01,"af_heart":2.06,"zm_yunjian":1.94},"w":["And that noise","adds up."]},{"t":"Now, | think about what is next to the robot.","id":"keynote_011","d":{"web-sg":3.39,"af_heart":2.74,"zm_yunjian":2.79},"w":["Now,","think about what is next to the robot."]},{"t":"ECG monitors. | Infusion pumps. | Blood-pressure monitors. | Bed sensors.","id":"keynote_012","d":{"web-sg":5.88,"af_heart":5.8,"zm_yunjian":5.94},"w":["ECG monitors.","Infusion pumps.","Blood-pressure monitors.","Bed sensors."]},{"t":"These devices are *sensitive* to EMI.","id":"keynote_013","d":{"web-sg":2.41,"af_heart":2.3,"zm_yunjian":2.33},"w":["These devices are sensitive to EMI."]},{"t":"So our goal is simple.","id":"keynote_014","d":{"web-sg":1.52,"af_heart":1.13,"zm_yunjian":1.23},"w":["So our goal is simple."]},{"t":"Remove the noise | *at its source*.","id":"keynote_015","d":{"web-sg":2.56,"af_heart":2.39,"zm_yunjian":2.45},"w":["Remove the noise","at its source."]},{"t":"Make the inverter switch | at *zero voltage*.","id":"keynote_016","d":{"web-sg":3.25,"af_heart":2.94,"zm_yunjian":3.09},"w":["Make the inverter switch","at zero voltage."]}]},{"label":"SLIDE 03 · 目标 0:50","title":"Existing methods cost parts or stress","lines":[{"t":"Soft switching is not new.","id":"keynote_017","d":{"web-sg":1.79,"af_heart":1.51,"zm_yunjian":1.54},"w":["Soft switching is not new."]},{"t":"But every method | has a cost.","id":"keynote_018","d":{"web-sg":2.35,"af_heart":2.27,"zm_yunjian":2.15},"w":["But every method","has a cost."]},{"t":"ARCPI gives you ZVS. | But it needs *many* extra parts.","id":"keynote_019","d":{"web-sg":3.94,"af_heart":3.67,"zm_yunjian":3.79},"w":["ARCPI gives you ZVS.","But it needs many extra parts."]},{"t":"More parts. | More cost. | More loss.","id":"keynote_020","d":{"web-sg":3.12,"af_heart":3.26,"zm_yunjian":3.12},"w":["More parts.","More cost.","More loss."]},{"t":"Resonant DC-link inverters are simpler. | But the resonant current is *almost as large as the load current*.","id":"keynote_021","d":{"web-sg":7.59,"af_heart":6.34,"zm_yunjian":6.22},"w":["Resonant DC-link inverters are simpler.","But the resonant current is almost as large as the load current."]},{"t":"That means | *high stress* on the passive parts.","id":"keynote_022","d":{"web-sg":3.45,"af_heart":2.87,"zm_yunjian":2.92},"w":["That means","high stress on the passive parts."]},{"t":"We wanted something different.","id":"keynote_023","d":{"web-sg":2.07,"af_heart":1.47,"zm_yunjian":1.46},"w":["We wanted something different."]},{"t":"*Two* switches. | *One* inductor. | *One* capacitor. | *One* diode.","id":"keynote_024","d":{"web-sg":4.92,"af_heart":4.92,"zm_yunjian":4.72},"w":["Two switches.","One inductor.","One capacitor.","One diode."]},{"t":"And a *small* circulating current.","id":"keynote_025","d":{"web-sg":2.21,"af_heart":1.7,"zm_yunjian":1.71},"w":["And a small circulating current."]}]},{"label":"SLIDE 04 · 目标 0:30","title":"This work moves to hardware","lines":[{"t":"Here is our journey.","id":"keynote_026","d":{"web-sg":1.38,"af_heart":1.06,"zm_yunjian":1.14},"w":["Here is our journey."]},{"t":"*Last year*, at ITEC Asia-Pacific, | we proposed the circuit. | And we proved it in *simulation*.","id":"keynote_027","d":{"web-sg":7.12,"af_heart":6.11,"zm_yunjian":5.85},"w":["Last year, at I tech Asia-Pacific,","we proposed the circuit.","And we proved it in simulation."]},{"t":"*This year*, | we built the *hardware*. | A real 24-volt PMSM drive.","id":"keynote_028","d":{"web-sg":4.98,"af_heart":5.28,"zm_yunjian":5.15},"w":["This year,","we built the hardware.","A real 24-volt PMSM drive."]},{"t":"*Next*, | the full evaluation. | Loss. | Efficiency. | EMI.","id":"keynote_029","d":{"web-sg":5.06,"af_heart":5.56,"zm_yunjian":5.32},"w":["Next,","the full evaluation.","Loss.","Efficiency.","EMI."]}]},{"label":"SLIDE 05 · 目标 0:45","title":"The add-on sits at the DC link","lines":[{"t":"This is the circuit.","id":"keynote_030","d":{"web-sg":1.38,"af_heart":1.11,"zm_yunjian":1.07},"w":["This is the circuit."]},{"t":"On the right, | a *standard* three-phase inverter, | driving the motor.","id":"keynote_031","d":{"web-sg":5.32,"af_heart":4.41,"zm_yunjian":4.34},"w":["On the right,","a standard three-phase inverter,","driving the motor."]},{"t":"On the left, | our *add-on*.","id":"keynote_032","d":{"web-sg":2.08,"af_heart":1.95,"zm_yunjian":1.88},"w":["On the left,","our add-on."]},{"t":"S-bus connects the source. | Or cuts it off.","id":"keynote_033","d":{"web-sg":3.32,"af_heart":2.81,"zm_yunjian":2.97},"w":["S-bus connects the source.","Or cuts it off."]},{"t":"S-aux, Lr and Cr | form the *resonant branch*.","id":"keynote_034","d":{"web-sg":3.45,"af_heart":3.45,"zm_yunjian":3.44},"w":["S-aux, L r and C r","form the resonant branch."]},{"t":"And Da clamps the capacitor voltage.","id":"keynote_035","d":{"web-sg":2.55,"af_heart":2.15,"zm_yunjian":2.19},"w":["And D a clamps the capacitor voltage."]},{"t":"Here is the key point.","id":"keynote_036","d":{"web-sg":1.52,"af_heart":1.23,"zm_yunjian":1.26},"w":["Here is the key point."]},{"t":"The three-phase bridge | is *not changed*. | At all.","id":"keynote_037","d":{"web-sg":4.01,"af_heart":3.66,"zm_yunjian":3.51},"w":["The three-phase bridge","is not changed.","At all."]},{"t":"We simply add this circuit | at the DC link.","id":"keynote_038","d":{"web-sg":3.32,"af_heart":2.88,"zm_yunjian":3.21},"w":["We simply add this circuit","at the DC link."]}]},{"label":"SLIDE 06 · 目标 1:05","title":"Switch only when the link is at zero","lines":[{"t":"How does it work?","id":"keynote_039","d":{"web-sg":1.2,"af_heart":0.95,"zm_yunjian":0.97},"w":["How does it work?"]},{"t":"*Three* steps.","id":"keynote_040","d":{"web-sg":1.2,"af_heart":0.86,"zm_yunjian":0.78},"w":["Three steps."]},{"t":"Step one. | *Disconnect.*","id":"keynote_041","d":{"web-sg":1.87,"af_heart":2.09,"zm_yunjian":2},"w":["Step one.","Disconnect."]},{"t":"S-bus turns off. | The link voltage falls | to almost *zero*.","id":"keynote_042","d":{"web-sg":4.63,"af_heart":4.36,"zm_yunjian":4.51},"w":["S-bus turns off.","The link voltage falls","to almost zero."]},{"t":"Step two. | *Commutate.*","id":"keynote_043","d":{"web-sg":1.8,"af_heart":2.09,"zm_yunjian":2.06},"w":["Step two.","Commutate."]},{"t":"Now the bridge switches, | with *no voltage* across them. | That is *zero-voltage switching*.","id":"keynote_044","d":{"web-sg":6.7,"af_heart":5.34,"zm_yunjian":5.53},"w":["Now the bridge switches,","with no voltage across them.","That is zero-voltage switching."]},{"t":"Step three. | *Restore.*","id":"keynote_045","d":{"web-sg":1.8,"af_heart":2,"zm_yunjian":1.99},"w":["Step three.","Restore."]},{"t":"S-aux turns on. | Lr and Cr resonate. | The link comes back to the input voltage.","id":"keynote_046","d":{"web-sg":6.29,"af_heart":6.01,"zm_yunjian":5.96},"w":["S-aux turns on.","L r and C r resonate.","The link comes back to the input voltage."]},{"t":"And S-bus turns on again, | also at *zero voltage*.","id":"keynote_047","d":{"web-sg":3.66,"af_heart":3.4,"zm_yunjian":3.51},"w":["And S-bus turns on again,","also at zero voltage."]},{"t":"What is left | is a *small* circulating current.","id":"keynote_048","d":{"web-sg":3.45,"af_heart":2.94,"zm_yunjian":2.99},"w":["What is left","is a small circulating current."]},{"t":"About *one-tenth* | to *one-hundredth* | of the input current.","id":"keynote_049","d":{"web-sg":4.56,"af_heart":4.05,"zm_yunjian":4.11},"w":["About one-tenth","to one-hundredth","of the input current."]},{"t":"So the extra loss | is *small*.","id":"keynote_050","d":{"web-sg":2.28,"af_heart":2.26,"zm_yunjian":2.31},"w":["So the extra loss","is small."]}]},{"label":"SLIDE 07 · 目标 0:35","title":"Control plugs into standard FOC","lines":[{"t":"Now, | the control.","id":"keynote_051","d":{"web-sg":1.59,"af_heart":1.68,"zm_yunjian":1.57},"w":["Now,","the control."]},{"t":"We did *not* change field-oriented control.","id":"keynote_052","d":{"web-sg":2.83,"af_heart":2.41,"zm_yunjian":2.29},"w":["We did not change field-oriented control."]},{"t":"Same speed loop. | Same current loop. | Same Clarke and Park transforms.","id":"keynote_053","d":{"web-sg":5.53,"af_heart":4.87,"zm_yunjian":4.92},"w":["Same speed loop.","Same current loop.","Same Clarke and Park transforms."]},{"t":"We add | *one* block, | after the PWM.","id":"keynote_054","d":{"web-sg":3.05,"af_heart":3.58,"zm_yunjian":3.34},"w":["We add","one block,","after the PWM."]},{"t":"*Six* flip-flops | follow the switching edges.","id":"keynote_055","d":{"web-sg":3.32,"af_heart":2.88,"zm_yunjian":2.95},"w":["Six flip-flops","follow the switching edges."]},{"t":"They create short pulses | for S-bus and S-aux.","id":"keynote_056","d":{"web-sg":3.52,"af_heart":3.24,"zm_yunjian":3.35},"w":["They create short pulses","for S-bus and S-aux."]},{"t":"That’s it.","id":"keynote_057","d":{"web-sg":1.2,"af_heart":0.69,"zm_yunjian":0.53},"w":["That’s it."]},{"t":"It plugs into an *existing* FOC drive.","id":"keynote_058","d":{"web-sg":2.62,"af_heart":2.4,"zm_yunjian":2.47},"w":["It plugs into an existing F O C drive."]}]},{"label":"SLIDE 08 · 目标 0:40","title":"Simulation showed ZVS on every switch","lines":[{"t":"Last year, | we simulated it, | at *15 kilohertz*.","id":"keynote_059","d":{"web-sg":3.87,"af_heart":3.89,"zm_yunjian":3.93},"w":["Last year,","we simulated it,","at 15 kilohertz."]},{"t":"The main switch: | *ZVS* turn-on. | *ZCS* turn-off.","id":"keynote_060","d":{"web-sg":3.81,"af_heart":4.22,"zm_yunjian":4.15},"w":["The main switch:","ZVS turn-on.","ZCS turn-off."]},{"t":"Both auxiliary switches: | *ZVS* turn-on.","id":"keynote_061","d":{"web-sg":2.97,"af_heart":3.06,"zm_yunjian":3.07},"w":["Both auxiliary switches:","ZVS turn-on."]},{"t":"And the output current | is *smooth*.","id":"keynote_062","d":{"web-sg":2.7,"af_heart":2.4,"zm_yunjian":2.34},"w":["And the output current","is smooth."]},{"t":"But simulation | is only simulation.","id":"keynote_063","d":{"web-sg":2.76,"af_heart":2.77,"zm_yunjian":2.73},"w":["But simulation","is only simulation."]},{"t":"The real question was: | does it work | in *hardware*?","id":"keynote_064","d":{"web-sg":4.15,"af_heart":3.69,"zm_yunjian":3.72},"w":["The real question was:","does it work","in hardware?"]}]},{"label":"SLIDE 09 · 目标 0:50","title":"The prototype adds one sub-board","lines":[{"t":"So we built it.","id":"keynote_065","d":{"web-sg":1.2,"af_heart":0.93,"zm_yunjian":0.9},"w":["So we built it."]},{"t":"The main inverter | is a TI DRV8353Rx evaluation board.","id":"keynote_066","d":{"web-sg":4.63,"af_heart":5.57,"zm_yunjian":5.53},"w":["The main inverter","is a TI D R V 8 3 5 3 R x evaluation board."]},{"t":"The controller | is a LAUNCHXL-F28027F, | running InstaSPIN-FOC.","id":"keynote_067","d":{"web-sg":5.87,"af_heart":6.71,"zm_yunjian":6.56},"w":["The controller","is a Launch X L, F 2 8 0 2 7 F,","running Insta Spin, F O C."]},{"t":"Our circuit | is *one* small sub-board | on the DC link.","id":"keynote_068","d":{"web-sg":4.29,"af_heart":4.15,"zm_yunjian":4.14},"w":["Our circuit","is one small sub-board","on the DC link."]},{"t":"*Two* 100-volt MOSFETs. | A *0.15-microhenry* inductor. | A *0.1-microfarad* capacitor.","id":"keynote_069","d":{"web-sg":6.15,"af_heart":7.31,"zm_yunjian":7.11},"w":["Two 100-volt MOSFETs.","A 0.15-microhenry inductor.","A 0.1-microfarad capacitor."]},{"t":"The *same* microcontroller | drives everything.","id":"keynote_070","d":{"web-sg":3.39,"af_heart":2.94,"zm_yunjian":2.99},"w":["The same microcontroller","drives everything."]},{"t":"And the main bridge | is *not modified*.","id":"keynote_071","d":{"web-sg":2.9,"af_heart":2.4,"zm_yunjian":2.3},"w":["And the main bridge","is not modified."]},{"t":"*24 volts*. | *20 kilohertz*. | A 24-volt PMSM, | with *14* pole pairs.","id":"keynote_072","d":{"web-sg":5.33,"af_heart":6.88,"zm_yunjian":7.3},"w":["24 volts.","20 kilohertz.","A 24-volt PMSM,","with 14 pole pairs."]}]},{"label":"SLIDE 10 · 目标 0:50","title":"Gate timing follows the design","lines":[{"t":"We looked at one transition. | V1 to V2.","id":"keynote_073","d":{"web-sg":3.18,"af_heart":3.05,"zm_yunjian":3.17},"w":["We looked at one transition.","V 1 to V 2."]},{"t":"A *typical* change | in PMSM operation.","id":"keynote_074","d":{"web-sg":2.83,"af_heart":3.08,"zm_yunjian":3.19},"w":["A typical change","in PMSM operation."]},{"t":"Here are the gate signals.","id":"keynote_075","d":{"web-sg":1.79,"af_heart":1.31,"zm_yunjian":1.37},"w":["Here are the gate signals."]},{"t":"*First*, | S-bus turns off.","id":"keynote_076","d":{"web-sg":2.01,"af_heart":2.3,"zm_yunjian":2.17},"w":["First,","S-bus turns off."]},{"t":"*Then*, | S1 turns on.","id":"keynote_077","d":{"web-sg":1.73,"af_heart":2.2,"zm_yunjian":1.96},"w":["Then,","S 1 turns on."]},{"t":"*Next*, | S-aux turns on.","id":"keynote_078","d":{"web-sg":1.87,"af_heart":2.29,"zm_yunjian":2.17},"w":["Next,","S-aux turns on."]},{"t":"*Finally*, | S-bus turns on again.","id":"keynote_079","d":{"web-sg":2.49,"af_heart":2.49,"zm_yunjian":2.57},"w":["Finally,","S-bus turns on again."]},{"t":"The whole sequence | takes about | *330 nanoseconds*.","id":"keynote_080","d":{"web-sg":4.08,"af_heart":4.69,"zm_yunjian":4.87},"w":["The whole sequence","takes about","330 nanoseconds."]},{"t":"Exactly | *as designed*.","id":"keynote_081","d":{"web-sg":1.8,"af_heart":2.19,"zm_yunjian":2.14},"w":["Exactly","as designed."]}]},{"label":"SLIDE 11 · 目标 0:45","title":"Resonance pulls the DC link near zero","lines":[{"t":"Now, | the commutation.","id":"keynote_082","d":{"web-sg":1.87,"af_heart":1.93,"zm_yunjian":1.88},"w":["Now,","the commutation."]},{"t":"S-bus turns off. | S-aux turns on. | Lr and Cr start to *resonate*.","id":"keynote_083","d":{"web-sg":5.18,"af_heart":5.33,"zm_yunjian":5.2},"w":["S-bus turns off.","S-aux turns on.","L r and C r start to resonate."]},{"t":"The DC-link voltage | drops | close to *zero*.","id":"keynote_084","d":{"web-sg":3.6,"af_heart":3.87,"zm_yunjian":3.78},"w":["The DC-link voltage","drops","close to zero."]},{"t":"A short | *low-voltage window*.","id":"keynote_085","d":{"web-sg":2.28,"af_heart":2.46,"zm_yunjian":2.32},"w":["A short","low-voltage window."]},{"t":"At the same time, | you can see the *resonant exchange*, | in the capacitor voltage | and the inductor current.","id":"keynote_086","d":{"web-sg":8.36,"af_heart":6.77,"zm_yunjian":6.86},"w":["At the same time,","you can see the resonant exchange,","in the capacitor voltage","and the inductor current."]},{"t":"So the auxiliary branch | *takes part in the commutation*.","id":"keynote_087","d":{"web-sg":4.14,"af_heart":3.77,"zm_yunjian":3.76},"w":["So the auxiliary branch","takes part in the commutation."]},{"t":"And it creates the condition | for *soft switching*.","id":"keynote_088","d":{"web-sg":3.73,"af_heart":2.85,"zm_yunjian":2.91},"w":["And it creates the condition","for soft switching."]}]},{"label":"SLIDE 12 · 目标 0:55","title":"The aux branch suppresses ringing","lines":[{"t":"This | is the *key result*.","id":"keynote_089","d":{"web-sg":2.01,"af_heart":2.06,"zm_yunjian":1.89},"w":["This","is the key result."]},{"t":"Two cases.","id":"keynote_090","d":{"web-sg":1.2,"af_heart":0.87,"zm_yunjian":0.83},"w":["Two cases."]},{"t":"On the left, | S-bus *and* S-aux, | as proposed.","id":"keynote_091","d":{"web-sg":3.74,"af_heart":3.69,"zm_yunjian":3.71},"w":["On the left,","S-bus and S-aux,","as proposed."]},{"t":"The voltage transition | is *smooth*. | No visible ringing.","id":"keynote_092","d":{"web-sg":4.5,"af_heart":4.05,"zm_yunjian":4.14},"w":["The voltage transition","is smooth.","No visible ringing."]},{"t":"On the right, | we turned S-aux *off*.","id":"keynote_093","d":{"web-sg":2.76,"af_heart":2.48,"zm_yunjian":2.51},"w":["On the right,","we turned S-aux off."]},{"t":"Look at this. | *Strong* high-frequency ringing.","id":"keynote_094","d":{"web-sg":3.45,"af_heart":2.75,"zm_yunjian":2.82},"w":["Look at this.","Strong high-frequency ringing."]},{"t":"*One* difference. | The auxiliary branch.","id":"keynote_095","d":{"web-sg":2.97,"af_heart":2.61,"zm_yunjian":2.59},"w":["One difference.","The auxiliary branch."]},{"t":"It gives the commutation | a *controlled path*.","id":"keynote_096","d":{"web-sg":3.39,"af_heart":2.93,"zm_yunjian":3.07},"w":["It gives the commutation","a controlled path."]},{"t":"And the ringing | is *suppressed*.","id":"keynote_097","d":{"web-sg":2.49,"af_heart":2,"zm_yunjian":1.95},"w":["And the ringing","is suppressed."]}]},{"label":"SLIDE 13 · 目标 0:45","title":"Mechanism confirmed, numbers next","lines":[{"t":"Let me summarize.","id":"keynote_098","d":{"web-sg":1.2,"af_heart":1.09,"zm_yunjian":1.12},"w":["Let me summarize."]},{"t":"We took this idea | from *simulation* | to *hardware*.","id":"keynote_099","d":{"web-sg":4.01,"af_heart":3.86,"zm_yunjian":3.9},"w":["We took this idea","from simulation","to hardware."]},{"t":"We confirmed *three* things.","id":"keynote_100","d":{"web-sg":1.79,"af_heart":1.46,"zm_yunjian":1.38},"w":["We confirmed three things."]},{"t":"*One*: | the switching sequence | works as designed.","id":"keynote_101","d":{"web-sg":4.01,"af_heart":3.84,"zm_yunjian":3.65},"w":["One:","the switching sequence","works as designed."]},{"t":"*Two*: | the resonant branch | creates a *low-volta     state.rate = r;
    store.set("rate", r);
    $("rate").value = r;
    $("rate-out").textContent = r.toFixed(2) + "×";
    document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(Math.abs(Number(c.dataset.rate) - r) < 0.001)));
    applyRate();
    refreshTimes();
    if (state.loaded && audio.duration > 0) setProgress(state.loaded, audio.currentTime / audio.duration);
    // the browser voice only takes a new rate on its next sentence: restart it once the slider settles
    clearTimeout(rateTimer);
    if (state.playing && isWeb(state.voice)) rateTimer = setTimeout(() => { if (state.playing) play(state.idx[state.tab]); }, 300);
  }
  let rateTimer = 0;

  function setVoice(v) {
    state.voice = v;
    store.set("voice", v);
    document.querySelectorAll(".vchip[data-voice]").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.voice === v)));
    refreshTimes();
    $("web-hint").hidden = !(isWeb(v) && !webVoice && synthReady());
    if (state.playing) play(state.idx[state.tab]);
    else if (state.loaded) setProgress(state.loaded, 0);
  }
  // voices load late in some browsers: only call a voice missing once the list has arrived
  function synthReady() { return !("speechSynthesis" in window) || window.speechSynthesis.getVoices().length > 0; }
  const vbox = $("voices");
  VOICES.forEach((v) => {
    const c = document.createElement("button");
    c.type = "button";
    c.className = "vchip";
    c.dataset.voice = v.id;
    if (v.web) c.dataset.web = v.web;
    c.textContent = v.label;
    c.addEventListener("click", () => setVoice(v.id));
    vbox.appendChild(c);
  });
  $("voices-row").hidden = VOICES.length < 2;

  function setTab(tab) {
    if (state.playing) pause();
    state.tab = tab;
    store.set("tab", tab);
    const isTalk = tab !== "chair";
    if (isTalk) store.set("version", tab);
    document.body.dataset.tab = isTalk ? "talk" : "chair";
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.tab === (isTalk ? "talk" : "chair"))));
    PANELS.forEach((p) => { $("lyrics-" + p).hidden = p !== tab; });
    $("version-row").hidden = !isTalk;
    document.querySelectorAll(".vchip[data-ver]").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.ver === tab)));
    $("kn-legend").hidden = tab !== "keynote";
    if (history.replaceState) history.replaceState(null, "", "#" + tab);
    state.follow = true;
    $("follow").hidden = true;
    setCurrent(state.idx[tab], false);
    updateUI();
    window.scrollTo({ top: 0 });
  }

  document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
    setTab(t.dataset.tab === "chair" ? "chair" : (store.get("version", "talk") === "keynote" ? "keynote" : "talk"));
  }));
  document.querySelectorAll(".vchip[data-ver]").forEach((c) => c.addEventListener("click", () => setTab(c.dataset.ver)));
  PANELS.forEach((tab) => {
    $("lyrics-" + tab).addEventListener("click", (e) => {
      const lineEl = e.target.closest(".line");
      if (!lineEl) return;
      if (window.getSelection && String(window.getSelection()).length > 0) return;
      const i = Number(lineEl.dataset.i);
      state.follow = true;
      $("follow").hidden = true;
      if (e.target.closest(".mplay") && i === state.idx[tab]) { toggle(); return; }
      play(i);
    });
  });
  $("play").addEventListener("click", toggle);
  $("prev").addEventListener("click", () => step(-1));
  $("next").addEventListener("click", () => step(1));
  document.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => setRate(Number(c.dataset.rate))));
  $("rate").addEventListener("input", (e) => setRate(Number(e.target.value)));
  $("gear").addEventListener("click", () => {
    const open = $("opts").hidden;
    $("opts").hidden = !open;
    $("gear").setAttribute("aria-expanded", String(open));
    measureBar();
  });
  $("gap").value = state.gap;
  $("gap").addEventListener("change", (e) => { state.gap = e.target.value; store.set("gap", state.gap); });
  function bindToggle(id, key) {
    const b = $(id);
    b.setAttribute("aria-pressed", String(state[key]));
    b.addEventListener("click", () => {
      state[key] = !state[key];
      store.set(key, state[key]);
      b.setAttribute("aria-pressed", String(state[key]));
    });
  }
  bindToggle("cont", "cont");
  bindToggle("loop", "loop");

  $("follow").addEventListener("click", () => {
    state.follow = true;
    $("follow").hidden = true;
    scrollToCurrent();
  });
  const userScrolled = () => {
    if (performance.now() < progScrollUntil || !state.playing) return;
    state.follow = false;
    $("follow").hidden = false;
  };
  window.addEventListener("wheel", userScrolled, { passive: true });
  window.addEventListener("touchmove", userScrolled, { passive: true });

  document.addEventListener("keydown", (e) => {
    if (e.target.closest && e.target.closest("input, select, textarea")) return;
    if (e.code === "Space") {
      if (e.target.closest && e.target.closest("button")) return;
      e.preventDefault();
      toggle();
    } else if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setRate(state.rate + 0.05); }
    else if (e.key === "ArrowDown") { e.preventDefault(); setRate(state.rate - 0.05); }
  });

  function measureBar() {
    document.documentElement.style.setProperty("--barH", $("bar").offsetHeight + "px");
  }
  if ("ResizeObserver" in window) new ResizeObserver(measureBar).observe($("bar"));
  measureBar();

  setRate(state.rate);
  setVoice(state.voice);
  setTab(state.tab);
})();
</script>

</body>
</html>
