<title>PESA 2026 Rehearsal</title>

<style>
  /* Layout: one lyric column (max 760px) on a full-bleed colored stage; tabs pinned top, transport bar pinned bottom.
     Single committed look: the stage color is the design in both themes, so no light/dark split. */
  :root {
    --stage-talk: #3A6BA5;
    --stage-chair: #2D7769;
    --stage: var(--stage-talk);
    --now: #FFFFFF;
    --past: rgba(255, 255, 255, 0.68);
    --next: rgba(10, 20, 34, 0.86);
    --chip: rgba(255, 255, 255, 0.18);
    --shade: rgba(0, 0, 0, 0.16);
    --bar: #101722;
    --bar-2: #1A2230;
    --bar-fg: #EEF2F7;
    --bar-dim: #A3AEBD;
    --bar-line: #2A3546;
    --amber: #F5B841;
    --amber-ink: #1D1607;
    --font: "Figtree", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --barH: 112px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--stage);
    color: var(--now);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.6s ease;
  }
  body[data-tab="chair"] { --stage: var(--stage-chair); }
  .gutter {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  button, select, input { font-family: var(--font); }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  /* top */
  .top {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--stage);
    box-shadow: 0 14px 18px -6px var(--stage);
    padding-block: 14px 10px;
    transition: background-color 0.6s ease, box-shadow 0.6s ease;
  }
  .top-in {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .brand b { font-size: 15px; font-weight: 800; letter-spacing: 0.02em; }
  .brand span { font-size: 12px; font-weight: 600; color: var(--past); }
  .tabs { display: flex; gap: 4px; background: var(--shade); padding: 4px; border-radius: 999px; }
  .tab {
    border: 0;
    background: transparent;
    color: var(--past);
    font-weight: 700;
    font-size: 14px;
    line-height: 1;
    padding: 9px 14px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab small { font-weight: 600; opacity: 0.8; margin-left: 6px; font-size: 12px; }
  .tab[aria-selected="true"] { background: var(--now); color: var(--stage); }
  .hint { max-width: 760px; margin: 8px auto 0; font-size: 13px; color: var(--past); }
  .voices { max-width: 760px; margin: 10px auto 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; font-weight: 700; color: var(--past); }
  .vchips { display: flex; gap: 6px; flex-wrap: wrap; }
  .vchip {
    border: 0;
    background: var(--shade);
    color: var(--past);
    font-weight: 700;
    font-size: 13px;
    line-height: 1;
    padding: 8px 13px;
    border-radius: 999px;
    cursor: pointer;
  }
  .vchip[aria-pressed="true"] { background: var(--now); color: var(--stage); }
  .legend { font-weight: 600; }
  .legend u { text-decoration-color: var(--amber); text-decoration-thickness: 3px; text-underline-offset: 4px; }
  .pause { opacity: 0.5; font-weight: 600; padding: 0 0.08em; }
  .w.em {
    text-decoration: underline;
    text-decoration-color: var(--amber);
    text-decoration-thickness: 3px;
    text-underline-offset: 6px;
  }
  .hint kbd {
    font-family: var(--font);
    font-size: 12px;
    font-weight: 700;
    background: var(--shade);
    border-radius: 5px;
    padding: 1px 6px;
  }
  .banner {
    max-width: 760px;
    margin: 10px auto 0;
    background: var(--bar);
    color: var(--bar-fg);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
  }

  /* lyrics */
  .lyrics {
    max-width: 760px;
    margin: 0 auto;
    padding-block: 18px calc(var(--barH) + 38vh);
    display: flex;
    flex-direction: column;
    gap: 44px;
  }
  .group { display: flex; flex-direction: column; gap: 4px; }
  .ghead { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
  .glabel { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--past); }
  .gtitle { margin: 0; font-size: 16px; font-weight: 700; color: var(--past); text-wrap: balance; }
  .gnote {
    margin: 0;
    align-self: flex-start;
    max-width: 100%;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.5;
    color: var(--now);
    background: var(--shade);
    padding: 6px 10px;
    border-radius: 8px;
  }
  .line { padding-block: 8px; cursor: pointer; min-width: 0; }
  .text {
    margin: 0;
    font-size: clamp(22px, 1.6vw + 15px, 34px);
    font-weight: 800;
    line-height: 1.28;
    letter-spacing: -0.01em;
    color: var(--next);
    overflow-wrap: anywhere;
    transition: color 0.35s ease;
  }
  .line.past .text { color: var(--past); }
  .line.now .text { color: var(--now); }
  .line.next:hover .text { color: rgba(255, 255, 255, 0.9); }
  .w { transition: opacity 0.15s linear; }
  .line.now.speaking .w { opacity: 0.6; }
  .line.now.speaking .w.lit { opacity: 1; }
  .mini { display: flex; align-items: center; gap: 10px; margin-top: 8px; opacity: 0.6; transition: opacity 0.35s ease; }
  .line.now .mini { opacity: 1; }
  .mplay {
    flex: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 0;
    background: var(--chip);
    color: var(--now);
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .line.now .mplay { background: var(--now); color: var(--stage); }
  .mplay svg { width: 12px; height: 12px; }
  .track { flex: 1; max-width: 320px; height: 4px; background: rgba(255, 255, 255, 0.24); border-radius: 2px; overflow: hidden; }
  .fill { height: 100%; width: 100%; background: var(--now); transform-origin: left center; transform: scaleX(0); }
  .time { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--past); min-width: 76px; }

  /* follow button */
  .follow {
    position: fixed;
    right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(var(--barH) + 16px);
    z-index: 9;
    border: 0;
    border-radius: 999px;
    background: var(--now);
    color: var(--stage);
    font-weight: 700;
    font-size: 14px;
    padding: 10px 16px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
  }

  /* transport bar */
  .bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    background: var(--bar);
    color: var(--bar-fg);
    border-top: 1px solid var(--bar-line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .bar-in {
    max-width: 1120px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: 16px;
    padding-block: 12px;
  }
  .np { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .np-label { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--bar-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-text { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .transport { display: flex; align-items: center; gap: 12px; }
  .tbtn {
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 50%;
    background: none;
    color: var(--bar-fg);
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .tbtn:hover { background: var(--bar-2); }
  .tbtn svg { width: 18px; height: 18px; }
  .tbtn.play { width: 50px; height: 50px; background: var(--bar-fg); color: var(--bar); }
  .tbtn.play:hover { background: #FFFFFF; }
  .tbtn.play svg { width: 20px; height: 20px; }
  .tools { display: flex; align-items: center; justify-content: flex-end; gap: 10px; min-width: 0; flex-wrap: wrap; }
  .chips { display: flex; gap: 4px; }
  .chip {
    border: 1px solid var(--bar-line);
    background: transparent;
    color: var(--bar-dim);
    font-weight: 700;
    font-size: 12px;
    line-height: 1;
    padding: 7px 8px;
    border-radius: 999px;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .chip[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); }
  #rate { width: 104px; accent-color: var(--amber); }
  .rate-out { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 44px; }
  .gear[aria-expanded="true"] { background: var(--bar-2); color: var(--amber); }
  .opts {
    max-width: 1120px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 18px;
    padding-block: 0 14px;
    font-size: 13px;
    color: var(--bar-dim);
  }
  .opts label { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .opts select {
    background: var(--bar-2);
    color: var(--bar-fg);
    border: 1px solid var(--bar-line);
    border-radius: 8px;
    padding: 6px 8px;
    font-weight: 600;
    font-size: 13px;
    max-width: 260px;
    min-width: 0;
  }
  .toggle {
    border: 1px solid var(--bar-line);
    background: transparent;
    color: var(--bar-dim);
    border-radius: 999px;
    padding: 7px 12px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .toggle[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); }
  .vhint { font-size: 12px; color: var(--bar-dim); }

  @media (max-width: 760px) {
    .bar-in { grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; padding-block: 10px; }
    .tools { grid-column: 1 / -1; justify-content: space-between; }
    .tbtn.play { width: 44px; height: 44px; }
    .transport { gap: 6px; }
    #rate { width: 84px; }
  }
  @media (max-width: 420px) {
    #rate, .rate-out { display: none; }
    .tab small { display: none; }
    .chip { padding: 7px 6px; }
  }
  @media (hover: none) {
    .hint .keys { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>

<script>
(() => {
  const DATA = {"talk":[{"label":"SLIDE 01 · 目标 0:25","title":"Title slide","lines":[{"t":"Good afternoon, everyone.","id":"talk_000","d":{"af_heart":1.6,"zm_yunjian":1.51}},{"t":"My name is Guiyi Dong, from the Frontier Research Center of Toyota Motor Corporation.","id":"talk_001","d":{"af_heart":5.1,"zm_yunjian":4.69}},{"t":"Today I’ll present our paper, “Analysis and Experimental Evaluation of a Zero-Voltage-Switching DC-Link Inverter for PMSM Drive.”","id":"talk_002","d":{"af_heart":9.3,"zm_yunjian":7.91}},{"t":"This is joint work with Yoh Sato and Yoshihiro Okumatsu.","id":"talk_003","d":{"af_heart":3.67,"zm_yunjian":3.63}}]},{"label":"SLIDE 02 · 目标 0:55","title":"Robot drives multiply switching noise","lines":[{"t":"Let me start with the motivation.","id":"talk_004","d":{"af_heart":1.75,"zm_yunjian":1.88}},{"t":"Mobile manipulators and humanoid robots are now moving into hospitals and homes.","id":"talk_005","d":{"af_heart":5.27,"zm_yunjian":4.97}},{"t":"A single robot can contain dozens of motors — in the arms, the wheels and the joints — and each motor has its own inverter.","id":"talk_006","d":{"af_heart":7.66,"zm_yunjian":6.49}},{"t":"In most of these drives, the inverter is hard-switched.","id":"talk_007","d":{"af_heart":3.07,"zm_yunjian":2.9}},{"t":"Hard switching creates high dv/dt, and when many drives run at the same time, this switching noise adds up.","id":"talk_008","d":{"af_heart":7.13,"zm_yunjian":5.93}},{"t":"In a hospital or a home, there is EMI-sensitive equipment nearby — for example ECG monitors, infusion pumps, blood-pressure monitors and bed sensors.","id":"talk_009","d":{"af_heart":10.3,"zm_yunjian":8.47}},{"t":"So our goal is simple: remove the noise at its source, by making the inverter switch at zero voltage.","id":"talk_010","d":{"af_heart":6.23,"zm_yunjian":5.57}}]},{"label":"SLIDE 03 · 目标 0:50","title":"Existing methods cost parts or stress","lines":[{"t":"Resonant soft switching for three-phase inverters has a long history.","id":"talk_011","d":{"af_heart":4.14,"zm_yunjian":3.92}},{"t":"Let me compare two main approaches.","id":"talk_012","d":{"af_heart":1.92,"zm_yunjian":2.05}},{"t":"The first is the auxiliary resonant commutated pole inverter, or ARCPI.","id":"talk_013","d":{"af_heart":4.5,"zm_yunjian":4.31}},{"t":"It achieves ZVS for the main switches and ZCS for the auxiliary switches, but it needs many auxiliary components, which increases cost and loss.","id":"talk_014","d":{"af_heart":10.03,"zm_yunjian":8.41}},{"t":"The second is the resonant DC-link inverter.","id":"talk_015","d":{"af_heart":2.82,"zm_yunjian":2.65}},{"t":"It is simpler, with few extra switches, but its resonant current is almost the same as the load current, so the passive components see high stress.","id":"talk_016","d":{"af_heart":8.7,"zm_yunjian":7.42}},{"t":"Our approach adds only two switches, one inductor, one capacitor and one diode — and the circulating current stays small.","id":"talk_017","d":{"af_heart":7.4,"zm_yunjian":6.46}}]},{"label":"SLIDE 04 · 目标 0:30","title":"This work moves to hardware","lines":[{"t":"This talk builds on our previous work.","id":"talk_018","d":{"af_heart":2.05,"zm_yunjian":2.13}},{"t":"Last year, at ITEC Asia-Pacific 2025, we proposed this circuit and verified it by simulation.","id":"talk_019","d":{"af_heart":7.13,"zm_yunjian":6.4}},{"t":"This year, we built the hardware and tested it on a 24-volt PMSM drive — this is the new contribution of today’s paper.","id":"talk_020","d":{"af_heart":8.23,"zm_yunjian":7.04}},{"t":"Next, we plan a journal version with the full evaluation.","id":"talk_021","d":{"af_heart":3.46,"zm_yunjian":3.2}}]},{"label":"SLIDE 05 · 目标 0:45","title":"The add-on sits at the DC link","lines":[{"t":"Here is the proposed circuit.","id":"talk_022","d":{"af_heart":1.6,"zm_yunjian":1.64}},{"t":"On the right, you can see a standard three-phase inverter driving the PMSM.","id":"talk_023","d":{"af_heart":4.39,"zm_yunjian":4.03}},{"t":"On the left is our auxiliary circuit.","id":"talk_024","d":{"af_heart":2.18,"zm_yunjian":2.09}},{"t":"The bus switch, S-bus, connects or disconnects the inverter from the DC source.","id":"talk_025","d":{"af_heart":4.82,"zm_yunjian":4.33}},{"t":"The auxiliary switch S-aux, the resonant inductor Lr and the resonant capacitor Cr form a resonant branch.","id":"talk_026","d":{"af_heart":7.4,"zm_yunjian":6.49}},{"t":"The diode Da clamps the capacitor voltage.","id":"talk_027","d":{"af_heart":2.82,"zm_yunjian":2.62}},{"t":"The key point is that the three-phase bridge itself is not changed at all.","id":"talk_028","d":{"af_heart":4.18,"zm_yunjian":3.86}},{"t":"The auxiliary circuit is simply added at the DC link.","id":"talk_029","d":{"af_heart":3.33,"zm_yunjian":3.35}}]},{"label":"SLIDE 06 · 目标 1:05","title":"Switch only when the link is at zero","lines":[{"t":"Now, how does it work?","id":"talk_030","d":{"af_heart":1.32,"zm_yunjian":1.3}},{"t":"The idea can be explained in three steps.","id":"talk_031","d":{"af_heart":2.35,"zm_yunjian":2.39}},{"t":"Step one: disconnect.","id":"talk_032","d":{"af_heart":1.47,"zm_yunjian":1.34}},{"t":"S-bus turns off.","id":"talk_033","d":{"af_heart":1.24,"zm_yunjian":1.24}},{"t":"The inverter is separated from the source, the DC-link capacitance discharges, and the link voltage falls to almost zero.","id":"talk_034","d":{"af_heart":7.57,"zm_yunjian":6.66}},{"t":"Step two: commutate.","id":"talk_035","d":{"af_heart":1.49,"zm_yunjian":1.41}},{"t":"While the link voltage is zero, the bridge switches change their state.","id":"talk_036","d":{"af_heart":3.78,"zm_yunjian":3.58}},{"t":"Because there is no voltage across them, they turn on under zero-voltage switching.","id":"talk_037","d":{"af_heart":4.67,"zm_yunjian":4.48}},{"t":"Step three: restore.","id":"talk_038","d":{"af_heart":1.37,"zm_yunjian":1.26}},{"t":"S-aux turns on, Lr and Cr resonate, and the link is recharged to the input voltage.","id":"talk_039","d":{"af_heart":6.12,"zm_yunjian":5.5}},{"t":"Then S-bus turns on again — also at zero voltage.","id":"talk_040","d":{"af_heart":3.29,"zm_yunjian":3.18}},{"t":"After this, only a small circulating current remains — about one-tenth to one-hundredth of the input current — so the extra loss is small.","id":"talk_041","d":{"af_heart":8.3,"zm_yunjian":7.3}},{"t":"The figure on the right shows the theoretical waveforms over the seven operating modes.","id":"talk_042","d":{"af_heart":5.01,"zm_yunjian":4.69}}]},{"label":"SLIDE 07 · 目标 0:35","title":"Control plugs into standard FOC","lines":[{"t":"The control is also modular.","id":"talk_043","d":{"af_heart":1.86,"zm_yunjian":1.92}},{"t":"We keep the standard field-oriented control — the speed and current PI loops, and the Clarke and Park transforms — exactly as it is.","id":"talk_044","d":{"af_heart":8.15,"zm_yunjian":6.81}},{"t":"We only add one block after the PWM output.","id":"talk_045","d":{"af_heart":3.24,"zm_yunjian":3.14}},{"t":"This block uses six flip-flops to follow the switching edges of S1 to S6, and it generates short notch pulses for S-bus and S-aux.","id":"talk_046","d":{"af_heart":8.94,"zm_yunjian":7.81}},{"t":"So the method can be added to an existing FOC drive.","id":"talk_047","d":{"af_heart":3.39,"zm_yunjian":3.18}}]},{"label":"SLIDE 08 · 目标 0:40","title":"Simulation showed ZVS on every switch","lines":[{"t":"This slide summarizes last year’s simulation, at a switching frequency of 15 kilohertz.","id":"talk_048","d":{"af_heart":5.55,"zm_yunjian":5.16}},{"t":"The main switch S1 achieved ZVS turn-on and ZCS turn-off.","id":"talk_049","d":{"af_heart":4.67,"zm_yunjian":4.27}},{"t":"Both auxiliary switches, S-bus and S-aux, achieved ZVS turn-on.","id":"talk_050","d":{"af_heart":4.76,"zm_yunjian":4.27}},{"t":"At the bottom, the three-phase output current is smooth, with low distortion.","id":"talk_051","d":{"af_heart":4.31,"zm_yunjian":3.97}},{"t":"However, this was only a simulation.","id":"talk_052","d":{"af_heart":2.15,"zm_yunjian":2.13}},{"t":"The open question was: does it also work on real hardware?","id":"talk_053","d":{"af_heart":3.63,"zm_yunjian":3.35}},{"t":"That is what we answer this year.","id":"talk_054","d":{"af_heart":1.75,"zm_yunjian":1.66}}]},{"label":"SLIDE 09 · 目标 0:50","title":"The prototype adds one sub-board","lines":[{"t":"So this year, we built a prototype.","id":"talk_055","d":{"af_heart":2.09,"zm_yunjian":1.96}},{"t":"The main inverter is a TI DRV8353Rx evaluation board, and the controller is a LAUNCHXL-F28027F microcontroller running InstaSPIN-FOC.","id":"talk_056","d":{"af_heart":14.1,"zm_yunjian":11.35}},{"t":"Our auxiliary circuit is built on a separate sub-board and connected to the DC link.","id":"talk_057","d":{"af_heart":4.91,"zm_yunjian":4.71}},{"t":"It uses two 100-volt silicon MOSFETs, a 0.15-microhenry inductor and a 0.1-microfarad capacitor.","id":"talk_058","d":{"af_heart":8.81,"zm_yunjian":7.49}},{"t":"The same microcontroller drives the auxiliary switches, synchronized with the PWM, and the main bridge is not modified.","id":"talk_059","d":{"af_heart":7.98,"zm_yunjian":7.04}},{"t":"The DC-link voltage is 24 volts, the switching frequency is 20 kilohertz, and the load is a 24-volt PMSM with 14 pole pairs.","id":"talk_060","d":{"af_heart":10.22,"zm_yunjian":8.81}}]},{"label":"SLIDE 10 · 目标 0:50","title":"Gate timing follows the design","lines":[{"t":"For the evaluation, we selected the transition from V1 to V2, shown here on the space-vector hexagon.","id":"talk_061","d":{"af_heart":6.89,"zm_yunjian":6.12}},{"t":"It is a typical active-vector change during PMSM operation.","id":"talk_062","d":{"af_heart":4.18,"zm_yunjian":3.84}},{"t":"The oscilloscope capture shows the measured gate signals of S-bus, S-aux and the main switch S1.","id":"talk_063","d":{"af_heart":6.12,"zm_yunjian":5.48}},{"t":"The sequence is: first, S-bus turns off.","id":"talk_064","d":{"af_heart":2.82,"zm_yunjian":2.41}},{"t":"Then S1 turns on.","id":"talk_065","d":{"af_heart":1.51,"zm_yunjian":1.47}},{"t":"Next, S-aux turns on.","id":"talk_066","d":{"af_heart":1.64,"zm_yunjian":1.54}},{"t":"Finally, S-bus turns on again.","id":"talk_067","d":{"af_heart":2.11,"zm_yunjian":1.94}},{"t":"The whole sequence fits in a window of about 330 nanoseconds.","id":"talk_068","d":{"af_heart":4.18,"zm_yunjian":4.01}},{"t":"This confirms that the three switches are coordinated in hardware, exactly as designed.","id":"talk_069","d":{"af_heart":5.33,"zm_yunjian":4.95}}]},{"label":"SLIDE 11 · 目标 0:45","title":"Resonance pulls the DC link near zero","lines":[{"t":"Here are the measured commutation waveforms.","id":"talk_070","d":{"af_heart":2.37,"zm_yunjian":2.39}},{"t":"When S-bus turns off and S-aux is activated, Lr and Cr start to resonate.","id":"talk_071","d":{"af_heart":5.38,"zm_yunjian":4.95}},{"t":"As a result, the inverter DC-link voltage, v-inv, drops quickly and forms a short low-voltage interval, close to zero.","id":"talk_072","d":{"af_heart":7.96,"zm_yunjian":6.74}},{"t":"At the same time, the capacitor voltage and the inductor current show the resonant energy exchange.","id":"talk_073","d":{"af_heart":6.04,"zm_yunjian":5.29}},{"t":"This tells us that the auxiliary branch directly takes part in the commutation, and that it creates the low-voltage condition needed for soft switching.","id":"talk_074","d":{"af_heart":8.64,"zm_yunjian":7.89}}]},{"label":"SLIDE 12 · 目标 0:55","title":"The aux branch suppresses ringing","lines":[{"t":"This is the key result of the paper.","id":"talk_075","d":{"af_heart":1.98,"zm_yunjian":1.96}},{"t":"To see the effect of the auxiliary branch, we compared two cases.","id":"talk_076","d":{"af_heart":3.88,"zm_yunjian":3.71}},{"t":"On the left, both S-bus and S-aux operate, as proposed.","id":"talk_077","d":{"af_heart":3.67,"zm_yunjian":3.29}},{"t":"The DC-link voltage makes a smooth transition, with no visible ringing.","id":"talk_078","d":{"af_heart":4.35,"zm_yunjian":4.25}},{"t":"On the right, we disabled S-aux and operated S-bus only.","id":"talk_079","d":{"af_heart":3.75,"zm_yunjian":3.46}},{"t":"Now you can see strong high-frequency ringing right after the voltage transition.","id":"talk_080","d":{"af_heart":4.65,"zm_yunjian":4.37}},{"t":"The only difference between the two cases is the auxiliary branch.","id":"talk_081","d":{"af_heart":3.78,"zm_yunjian":3.65}},{"t":"So the resonant branch provides a controlled commutation path and suppresses the switching oscillation.","id":"talk_082","d":{"af_heart":5.85,"zm_yunjian":5.46}},{"t":"This is our experimental evidence that the soft-switching scheme works.","id":"talk_083","d":{"af_heart":3.97,"zm_yunjian":3.63}}]},{"label":"SLIDE 13 · 目标 0:45","title":"Mechanism confirmed, numbers next","lines":[{"t":"To conclude.","id":"talk_084","d":{"af_heart":1,"zm_yunjian":0.96}},{"t":"We extended our parallel-resonant DC-link approach from simulation to hardware, on a 24-volt PMSM drive.","id":"talk_085","d":{"af_heart":8.06,"zm_yunjian":7.04}},{"t":"We confirmed three points: the coordinated switching sequence, the low-voltage interval created by the resonant branch, and clear ringing suppression.","id":"talk_086","d":{"af_heart":8.66,"zm_yunjian":7.32}},{"t":"There are also limitations.","id":"talk_087","d":{"af_heart":1.6,"zm_yunjian":1.62}},{"t":"The waveforms are slightly rounded, because the parameters are not yet optimized, and we have not yet measured loss, efficiency and EMI.","id":"talk_088","d":{"af_heart":8.45,"zm_yunjian":7.32}},{"t":"These, together with the full ZVS range, will be covered in our journal version.","id":"talk_089","d":{"af_heart":4.78,"zm_yunjian":4.37}}]},{"label":"SLIDE 14 · 目标 0:10","title":"Thank you — questions welcome","lines":[{"t":"Thank you very much for your attention.","id":"talk_090","d":{"af_heart":1.9,"zm_yunjian":1.94}},{"t":"I’m happy to take your questions.","id":"talk_091","d":{"af_heart":1.79,"zm_yunjian":1.83}}]}],"keynote":[{"label":"SLIDE 01 · 目标 0:25","title":"Title slide","lines":[{"t":"Good afternoon, everyone.","id":"keynote_000","d":{"af_heart":1.51,"zm_yunjian":1.42}},{"t":"My name is Guiyi Dong. | I’m from Toyota’s Frontier Research Center.","id":"keynote_001","d":{"af_heart":4.14,"zm_yunjian":3.99}},{"t":"Today, | I want to share *one simple idea*.","id":"keynote_002","d":{"af_heart":2.8,"zm_yunjian":2.81}},{"t":"Switch | *only when the voltage is zero*.","id":"keynote_003","d":{"af_heart":2.89,"zm_yunjian":2.85}},{"t":"This is joint work with Yoh Sato and Yoshihiro Okumatsu.","id":"keynote_004","d":{"af_heart":3.62,"zm_yunjian":3.53}}]},{"label":"SLIDE 02 · 目标 0:55","title":"Robot drives multiply switching noise","lines":[{"t":"Let’s start with robots.","id":"keynote_005","d":{"af_heart":1.35,"zm_yunjian":1.42}},{"t":"Robots are moving into *hospitals*. | Into *homes*.","id":"keynote_006","d":{"af_heart":3.22,"zm_yunjian":3.41}},{"t":"One robot can have *dozens* of motors.","id":"keynote_007","d":{"af_heart":2.2,"zm_yunjian":2.27}},{"t":"Every motor has its own inverter. | And most of them | are *hard-switched*.","id":"keynote_008","d":{"af_heart":4.77,"zm_yunjian":4.77}},{"t":"Hard switching means high *dv/dt*.","id":"keynote_009","d":{"af_heart":2.35,"zm_yunjian":2.3}},{"t":"And that noise | *adds up*.","id":"keynote_010","d":{"af_heart":2.06,"zm_yunjian":1.94}},{"t":"Now, | think about what is next to the robot.","id":"keynote_011","d":{"af_heart":2.74,"zm_yunjian":2.79}},{"t":"ECG monitors. | Infusion pumps. | Blood-pressure monitors. | Bed sensors.","id":"keynote_012","d":{"af_heart":5.8,"zm_yunjian":5.94}},{"t":"These devices are *sensitive* to EMI.","id":"keynote_013","d":{"af_heart":2.3,"zm_yunjian":2.33}},{"t":"So our goal is simple.","id":"keynote_014","d":{"af_heart":1.13,"zm_yunjian":1.23}},{"t":"Remove the noise | *at its source*.","id":"keynote_015","d":{"af_heart":2.39,"zm_yunjian":2.45}},{"t":"Make the inverter switch | at *zero voltage*.","id":"keynote_016","d":{"af_heart":2.94,"zm_yunjian":3.09}}]},{"label":"SLIDE 03 · 目标 0:50","title":"Existing methods cost parts or stress","lines":[{"t":"Soft switching is not new.","id":"keynote_017","d":{"af_heart":1.51,"zm_yunjian":1.54}},{"t":"But every method | has a cost.","id":"keynote_018","d":{"af_heart":2.27,"zm_yunjian":2.15}},{"t":"ARCPI gives you ZVS. | But it needs *many* extra parts.","id":"keynote_019","d":{"af_heart":3.67,"zm_yunjian":3.79}},{"t":"More parts. | More cost. | More loss.","id":"keynote_020","d":{"af_heart":3.26,"zm_yunjian":3.12}},{"t":"Resonant DC-link inverters are simpler. | But the resonant current is *almost as large as the load current*.","id":"keynote_021","d":{"af_heart":6.34,"zm_yunjian":6.22}},{"t":"That means | *high stress* on the passive parts.","id":"keynote_022","d":{"af_heart":2.87,"zm_yunjian":2.92}},{"t":"We wanted something different.","id":"keynote_023","d":{"af_heart":1.47,"zm_yunjian":1.46}},{"t":"*Two* switches. | *One* inductor. | *One* capacitor. | *One* diode.","id":"keynote_024","d":{"af_heart":4.92,"zm_yunjian":4.72}},{"t":"And a *small* circulating current.","id":"keynote_025","d":{"af_heart":1.7,"zm_yunjian":1.71}}]},{"label":"SLIDE 04 · 目标 0:30","title":"This work moves to hardware","lines":[{"t":"Here is our journey.","id":"keynote_026","d":{"af_heart":1.06,"zm_yunjian":1.14}},{"t":"*Last year*, at ITEC Asia-Pacific, | we proposed the circuit. | And we proved it in *simulation*.","id":"keynote_027","d":{"af_heart":6.11,"zm_yunjian":5.85}},{"t":"*This year*, | we built the *hardware*. | A real 24-volt PMSM drive.","id":"keynote_028","d":{"af_heart":5.28,"zm_yunjian":5.15}},{"t":"*Next*, | the full evaluation. | Loss. | Efficiency. | EMI.","id":"keynote_029","d":{"af_heart":5.56,"zm_yunjian":5.32}}]},{"label":"SLIDE 05 · 目标 0:45","title":"The add-on sits at the DC link","lines":[{"t":"This is the circuit.","id":"keynote_030","d":{"af_heart":1.11,"zm_yunjian":1.07}},{"t":"On the right, | a *standard* three-phase inverter, | driving the motor.","id":"keynote_031","d":{"af_heart":4.41,"zm_yunjian":4.34}},{"t":"On the left, | our *add-on*.","id":"keynote_032","d":{"af_heart":1.95,"zm_yunjian":1.88}},{"t":"S-bus connects the source. | Or cuts it off.","id":"keynote_033","d":{"af_heart":2.81,"zm_yunjian":2.97}},{"t":"S-aux, Lr and Cr | form the *resonant branch*.","id":"keynote_034","d":{"af_heart":3.45,"zm_yunjian":3.44}},{"t":"And Da clamps the capacitor voltage.","id":"keynote_035","d":{"af_heart":2.15,"zm_yunjian":2.19}},{"t":"Here is the key point.","id":"keynote_036","d":{"af_heart":1.23,"zm_yunjian":1.26}},{"t":"The three-phase bridge | is *not changed*. | At all.","id":"keynote_037","d":{"af_heart":3.66,"zm_yunjian":3.51}},{"t":"We simply add this circuit | at the DC link.","id":"keynote_038","d":{"af_heart":2.88,"zm_yunjian":3.21}}]},{"label":"SLIDE 06 · 目标 1:05","title":"Switch only when the link is at zero","lines":[{"t":"How does it work?","id":"keynote_039","d":{"af_heart":0.95,"zm_yunjian":0.97}},{"t":"*Three* steps.","id":"keynote_040","d":{"af_heart":0.86,"zm_yunjian":0.78}},{"t":"Step one. | *Disconnect.*","id":"keynote_041","d":{"af_heart":2.09,"zm_yunjian":2}},{"t":"S-bus turns off. | The link voltage falls | to almost *zero*.","id":"keynote_042","d":{"af_heart":4.36,"zm_yunjian":4.51}},{"t":"Step two. | *Commutate.*","id":"keynote_043","d":{"af_heart":2.09,"zm_yunjian":2.06}},{"t":"Now the bridge switches, | with *no voltage* across them. | That is *zero-voltage switching*.","id":"keynote_044","d":{"af_heart":5.34,"zm_yunjian":5.53}},{"t":"Step three. | *Restore.*","id":"keynote_045","d":{"af_heart":2,"zm_yunjian":1.99}},{"t":"S-aux turns on. | Lr and Cr resonate. | The link comes back to the input voltage.","id":"keynote_046","d":{"af_heart":6.01,"zm_yunjian":5.96}},{"t":"And S-bus turns on again, | also at *zero voltage*.","id":"keynote_047","d":{"af_heart":3.4,"zm_yunjian":3.51}},{"t":"What is left | is a *small* circulating current.","id":"keynote_048","d":{"af_heart":2.94,"zm_yunjian":2.99}},{"t":"About *one-tenth* | to *one-hundredth* | of the input current.","id":"keynote_049","d":{"af_heart":4.05,"zm_yunjian":4.11}},{"t":"So the extra loss | is *small*.","id":"keynote_050","d":{"af_heart":2.26,"zm_yunjian":2.31}}]},{"label":"SLIDE 07 · 目标 0:35","title":"Control plugs into standard FOC","lines":[{"t":"Now, | the control.","id":"keynote_051","d":{"af_heart":1.68,"zm_yunjian":1.57}},{"t":"We did *not* change field-oriented control.","id":"keynote_052","d":{"af_heart":2.41,"zm_yunjian":2.29}},{"t":"Same speed loop. | Same current loop. | Same Clarke and Park transforms.","id":"keynote_053","d":{"af_heart":4.87,"zm_yunjian":4.92}},{"t":"We add | *one* block, | after the PWM.","id":"keynote_054","d":{"af_heart":3.58,"zm_yunjian":3.34}},{"t":"*Six* flip-flops | follow the switching edges.","id":"keynote_055","d":{"af_heart":2.88,"zm_yunjian":2.95}},{"t":"They create short pulses | for S-bus and S-aux.","id":"keynote_056","d":{"af_heart":3.24,"zm_yunjian":3.35}},{"t":"That’s it.","id":"keynote_057","d":{"af_heart":0.69,"zm_yunjian":0.53}},{"t":"It plugs into an *existing* FOC drive.","id":"keynote_058","d":{"af_heart":2.4,"zm_yunjian":2.47}}]},{"label":"SLIDE 08 · 目标 0:40","title":"Simulation showed ZVS on every switch","lines":[{"t":"Last year, | we simulated it, | at *15 kilohertz*.","id":"keynote_059","d":{"af_heart":3.89,"zm_yunjian":3.93}},{"t":"The main switch: | *ZVS* turn-on. | *ZCS* turn-off.","id":"keynote_060","d":{"af_heart":4.22,"zm_yunjian":4.15}},{"t":"Both auxiliary switches: | *ZVS* turn-on.","id":"keynote_061","d":{"af_heart":3.06,"zm_yunjian":3.07}},{"t":"And the output current | is *smooth*.","id":"keynote_062","d":{"af_heart":2.4,"zm_yunjian":2.34}},{"t":"But simulation | is only simulation.","id":"keynote_063","d":{"af_heart":2.77,"zm_yunjian":2.73}},{"t":"The real question was: | does it work | in *hardware*?","id":"keynote_064","d":{"af_heart":3.69,"zm_yunjian":3.72}}]},{"label":"SLIDE 09 · 目标 0:50","title":"The prototype adds one sub-board","lines":[{"t":"So we built it.","id":"keynote_065","d":{"af_heart":0.93,"zm_yunjian":0.9}},{"t":"The main inverter | is a TI DRV8353Rx evaluation board.","id":"keynote_066","d":{"af_heart":5.57,"zm_yunjian":5.53}},{"t":"The controller | is a LAUNCHXL-F28027F, | running InstaSPIN-FOC.","id":"keynote_067","d":{"af_heart":6.71,"zm_yunjian":6.56}},{"t":"Our circuit | is *one* small sub-board | on the DC link.","id":"keynote_068","d":{"af_heart":4.15,"zm_yunjian":4.14}},{"t":"*Two* 100-volt MOSFETs. | A *0.15-microhenry* inductor. | A *0.1-microfarad* capacitor.","id":"keynote_069","d":{"af_heart":7.31,"zm_yunjian":7.11}},{"t":"The *same* microcontroller | drives everything.","id":"keynote_070","d":{"af_heart":2.94,"zm_yunjian":2.99}},{"t":"And the main bridge | is *not modified*.","id":"keynote_071","d":{"af_heart":2.4,"zm_yunjian":2.3}},{"t":"*24 volts*. | *20 kilohertz*. | A 24-volt PMSM, | with *14* pole pairs.","id":"keynote_072","d":{"af_heart":6.88,"zm_yunjian":7.3}}]},{"label":"SLIDE 10 · 目标 0:50","title":"Gate timing follows the design","lines":[{"t":"We looked at one transition. | V1 to V2.","id":"keynote_073","d":{"af_heart":3.05,"zm_yunjian":3.17}},{"t":"A *typical* change | in PMSM operation.","id":"keynote_074","d":{"af_heart":3.08,"zm_yunjian":3.19}},{"t":"Here are the gate signals.","id":"keynote_075","d":{"af_heart":1.31,"zm_yunjian":1.37}},{"t":"*First*, | S-bus turns off.","id":"keynote_076","d":{"af_heart":2.3,"zm_yunjian":2.17}},{"t":"*Then*, | S1 turns on.","id":"keynote_077","d":{"af_heart":2.2,"zm_yunjian":1.96}},{"t":"*Next*, | S-aux turns on.","id":"keynote_078","d":{"af_heart":2.29,"zm_yunjian":2.17}},{"t":"*Finally*, | S-bus turns on again.","id":"keynote_079","d":{"af_heart":2.49,"zm_yunjian":2.57}},{"t":"The whole sequence | takes about | *330 nanoseconds*.","id":"keynote_080","d":{"af_heart":4.69,"zm_yunjian":4.87}},{"t":"Exactly | *as designed*.","id":"keynote_081","d":{"af_heart":2.19,"zm_yunjian":2.14}}]},{"label":"SLIDE 11 · 目标 0:45","title":"Resonance pulls the DC link near zero","lines":[{"t":"Now, | the commutation.","id":"keynote_082","d":{"af_heart":1.93,"zm_yunjian":1.88}},{"t":"S-bus turns off. | S-aux turns on. | Lr and Cr start to *resonate*.","id":"keynote_083","d":{"af_heart":5.33,"zm_yunjian":5.2}},{"t":"The DC-link voltage | drops | close to *zero*.","id":"keynote_084","d":{"af_heart":3.87,"zm_yunjian":3.78}},{"t":"A short | *low-voltage window*.","id":"keynote_085","d":{"af_heart":2.46,"zm_yunjian":2.32}},{"t":"At the same time, | you can see the *resonant exchange*, | in the capacitor voltage | and the inductor current.","id":"keynote_086","d":{"af_heart":6.77,"zm_yunjian":6.86}},{"t":"So the auxiliary branch | *takes part in the commutation*.","id":"keynote_087","d":{"af_heart":3.77,"zm_yunjian":3.76}},{"t":"And it creates the condition | for *soft switching*.","id":"keynote_088","d":{"af_heart":2.85,"zm_yunjian":2.91}}]},{"label":"SLIDE 12 · 目标 0:55","title":"The aux branch suppresses ringing","lines":[{"t":"This | is the *key result*.","id":"keynote_089","d":{"af_heart":2.06,"zm_yunjian":1.89}},{"t":"Two cases.","id":"keynote_090","d":{"af_heart":0.87,"zm_yunjian":0.83}},{"t":"On the left, | S-bus *and* S-aux, | as proposed.","id":"keynote_091","d":{"af_heart":3.69,"zm_yunjian":3.71}},{"t":"The voltage transition | is *smooth*. | No visible ringing.","id":"keynote_092","d":{"af_heart":4.05,"zm_yunjian":4.14}},{"t":"On the right, | we turned S-aux *off*.","id":"keynote_093","d":{"af_heart":2.48,"zm_yunjian":2.51}},{"t":"Look at this. | *Strong* high-frequency ringing.","id":"keynote_094","d":{"af_heart":2.75,"zm_yunjian":2.82}},{"t":"*One* difference. | The auxiliary branch.","id":"keynote_095","d":{"af_heart":2.61,"zm_yunjian":2.59}},{"t":"It gives the commutation | a *controlled path*.","id":"keynote_096","d":{"af_heart":2.93,"zm_yunjian":3.07}},{"t":"And the ringing | is *suppressed*.","id":"keynote_097","d":{"af_heart":2,"zm_yunjian":1.95}}]},{"label":"SLIDE 13 · 目标 0:45","title":"Mechanism confirmed, numbers next","lines":[{"t":"Let me summarize.","id":"keynote_098","d":{"af_heart":1.09,"zm_yunjian":1.12}},{"t":"We took this idea | from *simulation* | to *hardware*.","id":"keynote_099","d":{"af_heart":3.86,"zm_yunjian":3.9}},{"t":"We confirmed *three* things.","id":"keynote_100","d":{"af_heart":1.46,"zm_yunjian":1.38}},{"t":"*One*: | the switching sequence | works as designed.","id":"keynote_101","d":{"af_heart":3.84,"zm_yunjian":3.65}},{"t":"*Two*: | the resonant branch | creates a *low-voltage window*.","id":"keynote_102","d":{"af_heart":4.19,"zm_yunjian":4.19}},{"t":"*Three*: | the ringing | is *suppressed*.","id":"keynote_103","d":{"af_heart":2.99,"zm_yunjian":2.78}},{"t":"What is next?","id":"keynote_104","d":{"af_heart":0.86,"zm_yunjian":0.84}},{"t":"The waveforms are still a little rounded. | We will *optimize* Lr and Cr.","id":"keynote_105","d":{"af_heart":4.46,"zm_yunjian":4.59}},{"t":"And we will *measure* | loss, | efficiency, | and EMI.","id":"keynote_106","d":{"af_heart":4.16,"zm_yunjian":4.17}},{"t":"Plus | the *full* ZVS range.","id":"keynote_107","d":{"af_heart":2.5,"zm_yunjian":2.4}},{"t":"All of this | in our *journal* version.","id":"keynote_108","d":{"af_heart":2.31,"zm_yunjian":2.47}}]},{"label":"SLIDE 14 · 目标 0:10","title":"Thank you — questions welcome","lines":[{"t":"Thank you. | I’m happy to take your questions.","id":"keynote_109","d":{"af_heart":2.81,"zm_yunjian":2.82}}]}],"chair":[{"label":"开场 · 问候与自我介绍","note":"按时段选 morning 或 afternoon","lines":[{"t":"Good morning (or afternoon), everyone, and welcome to Special Session 2 of PESA 2026: “Advanced Energy Conversion and Charging Systems for Robotics and Electrified Mobility.”","id":"chair_000","d":{"af_heart":12.01,"zm_yunjian":9.94}},{"t":"My name is Guiyi Dong, from Toyota Motor Corporation, and I am the chair of this session.","id":"chair_001","d":{"af_heart":5.18,"zm_yunjian":4.65}}]},{"label":"开场 · 联合主席（Yaohua Li 到场时）","note":"","lines":[{"t":"My co-chair, Dr. Yaohua Li from Nanyang Technological University, is here with me today.","id mponent count?","id":"chair_070","d":{"af_heart":3.54,"zm_yunjian":3.22}},{"t":"With GaN or SiC devices, how did you deal with layout parasitics and dv/dt?","id":"chair_071","d":{"af_heart":6.08,"zm_yunjian":5.21}},{"t":"What is the next step toward a real robot or vehicle application?","id":"chair_072","d":{"af_heart":3.95,"zm_yunjian":3.67}}]},{"label":"闭幕","note":"最后请讲者合影","lines":[{"t":"That concludes Special Session 2.","id":"chair_073","d":{"af_heart":1.9,"zm_yunjian":1.9}},{"t":"Let’s give one more round of applause to all of our speakers.","id":"chair_074","d":{"af_heart":3.07,"zm_yunjian":3.11}},{"t":"Thank you all for attending and for the excellent questions.","id":"chair_075","d":{"af_heart":3.18,"zm_yunjian":2.9}},{"t":"Thanks also to my co-chairs — Dr. Shiqiang Liu, Dr. Yaohua Li and Mr. Yong Ying — for helping to organize this session, and to the PESA organizing committee and volunteers.","id":"chair_076","d":{"af_heart":11.69,"zm_yunjian":9.47}},{"t":"[The coffee break] starts at [time] in [room].","id":"chair_077","d":{"af_heart":2.01,"zm_yunjian":2.09}},{"t":"Speakers, if you have a moment, let’s take a quick group photo at the front.","id":"chair_078","d":{"af_heart":3.99,"zm_yunjian":3.61}},{"t":"Thank you, and enjoy the rest of the conference.","id":"chair_079","d":{"af_heart":2.38,"zm_yunjian":2.47}}]}],"voices":[{"id":"af_heart","label":"美式女声"},{"id":"zm_yunjian","label":"华人口音男声"}],"mode":"external","base":"audio/"};

  const state = {
    voice: VOICES.some((v) => v.id === savedVoice) ? savedVoice : VOICES[0].id,
    loadedVoice: null,
    tab: startTab,
    idx: { talk: 0, keynote: 0, chair: 0 },
    playing: false,
    loaded: null, // line object whose audio is in the element
    rate: Number(store.get("rate", 1)) || 1,
    cont: store.get("cont", true),
    loop: store.get("loop", false),
    gap: String(store.get("gap", "0")),
    follow: true,
  };
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";

  const PLAY = '<path d="M7 4.5v15L19.5 12z"/>';
  const PAUSE = '<path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z"/>';
  const MINI_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15L19.5 12z"/></svg>';
  const MINI_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z"/></svg>';
  const fmt = (s) => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

  // ---------- render ----------
  const lines = { talk: [], keynote: [], chair: [] };
  function render(tab) {
    const root = $("lyrics-" + tab);
    const frag = document.createDocumentFragment();
    DATA[tab].forEach((g) => {
      const sec = document.createElement("section");
      sec.className = "group";
      const head = document.createElement("div");
      head.className = "ghead";
      const label = document.createElement("span");
      label.className = "glabel";
      label.textContent = g.label;
      head.appendChild(label);
      if (g.title) {
        const h = document.createElement("h2");
        h.className = "gtitle";
        h.textContent = g.title;
        head.appendChild(h);
      }
      if (g.note) {
        const n = document.createElement("p");
        n.className = "gnote";
        n.textContent = g.note;
        head.appendChild(n);
      }
      sec.appendChild(head);
      g.lines.forEach((ln) => {
        const i = lines[tab].length;
        const el = document.createElement("div");
        el.className = "line next";
        el.dataset.i = i;
        const p = document.createElement("p");
        p.className = "text";
        // markup: "|" = a deliberate pause, *words* = stressed; plain lines have neither
        const PAUSE_UNITS = 7; // a pause takes about as long as seven characters of speech
        const words = [];
        const at = [];
        let pos = 0;
        let em = false;
        ln.t.split(/(\s+)/).forEach((part) => {
          if (!part) return;
          if (/^\s+$/.test(part)) { p.appendChild(document.createTextNode(" ")); pos += 1; return; }
          if (part === "|") {
            const s = document.createElement("span");
            s.className = "pause";
            s.textContent = "‖";
            s.setAttribute("aria-hidden", "true");
            p.appendChild(s);
            pos += PAUSE_UNITS;
            return;
          }
          let text = part;
          if (text.startsWith("*")) { em = true; text = text.slice(1); }
          const closes = /\*[.,!?:;’”]*$/.test(text);
          text = text.replace(/\*/g, "");
          const w = document.createElement("span");
          w.className = em ? "w em" : "w";
          w.textContent = text;
          p.appendChild(w);
          words.push(w);
          at.push(pos);
          pos += text.length;
          if (closes) em = false;
        });
        const starts = at.map((x) => x / Math.max(1, pos));
        const plain = ln.t.replace(/\*/g, "").replace(/\s*\|\s*/g, " ").trim();
        const mini = document.createElement("div");
        mini.className = "mini";
        const b = document.createElement("button");
        b.className = "mplay";
        b.type = "button";
        b.setAttribute("aria-label", "播放这一句");
        b.innerHTML = MINI_PLAY;
        const track = document.createElement("div");
        track.className = "track";
        const fill = document.createElement("div");
        fill.className = "fill";
        track.appendChild(fill);
        const time = document.createElement("span");
        time.className = "time";
        mini.append(b, track, time);
        el.append(p, mini);
        sec.appendChild(el);
        lines[tab].push({ el, btn: b, fill, time, words, starts, t: plain, a: ln.a, id: ln.id, durs: ln.d, group: g.label, lit: 0,
          get d() { return this.durs[state.voice]; } });
      });
      frag.appendChild(sec);
    });
    root.appendChild(frag);
  }
  PANELS.forEach(render);

  function refreshTimes() {
    PANELS.forEach((tab) => lines[tab].forEach((L) => {
      if (L === state.loaded && audio.currentTime > 0) return;
      L.time.textContent = "0:00 / " + fmt(L.d / state.rate);
    }));
  }

  // ---------- views ----------
  function cur() { return lines[state.tab][state.idx[state.tab]]; }

  function setCurrent(i, scroll) {
    const arr = lines[state.tab];
    i = Math.max(0, Math.min(arr.length - 1, i));
    state.idx[state.tab] = i;
    arr.forEach((L, j) => {
      const cls = j < i ? "past" : j === i ? "now" : "next";
      if (!L.el.classList.contains(cls)) {
        L.el.classList.remove("past", "now", "next", "speaking");
        L.el.classList.add(cls);
      }
      if (j !== i) {
        L.el.classList.remove("speaking");
        L.fill.style.transform = j < i ? "scaleX(1)" : "scaleX(0)";
        L.btn.innerHTML = MINI_PLAY;
        L.btn.setAttribute("aria-label", "播放这一句");
      }
    });
    const L = arr[i];
    $("np-label").textContent = L.group;
    $("np-text").textContent = L.t;
    if (scroll !== false && state.follow) scrollToCurrent();
  }

  let progScrollUntil = 0;
  function scrollToCurrent() {
    progScrollUntil = performance.now() + 900;
    cur().el.scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" });
  }

  function setProgress(L, f) {
    f = Math.min(1, Math.max(0, f));
    L.fill.style.transform = "scaleX(" + f + ")";
    L.time.textContent = fmt((f * L.d) / state.rate) + " / " + fmt(L.d / state.rate);
    let n = 0;
    while (n < L.starts.length && L.starts[n] <= f + 0.02) n++;
    if (n !== L.lit) {
      L.words.forEach((w, k) => w.classList.toggle("lit", k < n));
      L.lit = n;
    }
  }

  function updateUI() {
    $("play-icon").innerHTML = state.playing ? PAUSE : PLAY;
    $("play").setAttribute("aria-label", state.playing ? "暂停" : "播放");
    const L = cur();
    L.btn.innerHTML = state.playing ? MINI_PAUSE : MINI_PLAY;
    L.btn.setAttribute("aria-label", state.playing ? "暂停" : "播放这一句");
    L.el.classList.toggle("speaking", state.playing);
  }

  // ---------- playback ----------
  let raf = 0;
  let gapTimer = 0;

  function applyRate() {
    audio.playbackRate = state.rate;
    audio.defaultPlaybackRate = state.rate;
    if ("preservesPitch" in audio) audio.preservesPitch = true;
    else if ("webkitPreservesPitch" in audio) audio.webkitPreservesPitch = true;
  }

  function tick() {
    const L = state.loaded;
    if (L && audio.duration > 0) setProgress(L, audio.currentTime / audio.duration);
    if (state.playing) raf = requestAnimationFrame(tick);
  }

  function srcFor(L) {
    return DATA.mode === "external"
      ? DATA.base + state.voice + "/" + L.id + ".mp3"
      : "data:audio/mpeg;base64," + L.a[state.voice];
  }
  const isLoaded = (L) => state.loaded === L && state.loadedVoice === state.voice;

  function play(i) {
    clearTimeout(gapTimer);
    cancelAnimationFrame(raf);
    setCurrent(i);
    const L = cur();
    if (!isLoaded(L)) {
      audio.src = srcFor(L);
      state.loaded = L;
      state.loadedVoice = state.voice;
    }
    audio.currentTime = 0;
    L.lit = -1;
    setProgress(L, 0);
    applyRate();
    state.playing = true;
    updateUI();
    const p = audio.play();
    if (p && p.catch) p.catch(() => { state.playing = false; updateUI(); });
    raf = requestAnimationFrame(tick);
  }

  function pause() {
    clearTimeout(gapTimer);
    audio.pause();
    state.playing = false;
    cancelAnimationFrame(raf);
    $("np-text").textContent = cur().t;
    updateUI();
  }

  function resume() {
    applyRate();
    state.playing = true;
    updateUI();
    const p = audio.play();
    if (p && p.catch) p.catch(() => { state.playing = false; updateUI(); });
    raf = requestAnimationFrame(tick);
  }

  // animation frames pause in background tabs; timeupdate keeps the bar honest there
  audio.addEventListener("timeupdate", () => {
    if (state.loaded && audio.duration > 0) setProgress(state.loaded, audio.currentTime / audio.duration);
  });

  audio.addEventListener("ended", () => {
    if (!state.playing) return;
    cancelAnimationFrame(raf);
    const i = state.idx[state.tab];
    const L = cur();
    setProgress(L, 1);
    const gapSec = state.gap === "auto" ? L.d / state.rate : Number(state.gap) || 0;
    const arr = lines[state.tab];
    let nextI = -1;
    if (state.loop) nextI = i;
    else if (state.cont && i + 1 < arr.length) nextI = i + 1;
    if (nextI < 0) {
      state.playing = false;
      updateUI();
      return;
    }
    if (gapSec > 0) {
      $("np-text").textContent = "跟读：请复述这一句（" + Math.round(gapSec) + " 秒）";
      L.el.classList.remove("speaking");
    }
    gapTimer = setTimeout(() => { if (state.playing) play(nextI); }, gapSec * 1000 + (state.loop && !gapSec ? 400 : 0));
  });

  function toggle() {
    if (state.playing) { pause(); return; }
    const L = cur();
    if (isLoaded(L) && audio.currentTime > 0 && !audio.ended) resume();
    else play(state.idx[state.tab]);
  }
  function step(d) {
    const i = state.idx[state.tab] + d;
    if (i < 0 || i >= lines[state.tab].length) return;
    state.follow = true;
    $("follow").hidden = true;
    if (state.playing) { play(i); return; }
    clearTimeout(gapTimer);
    setCurrent(i);
    updateUI();
  }

  // ---------- controls ----------
  function setRate(r) {
    r = Math.round(Math.min(1.75, Math.max(0.5, r)) * 100) / 100;
    state.rate = r;
    store.set("rate", r);
    $("rate").value = r;
    $("rate-out").textContent = r.toFixed(2) + "×";
    document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(Math.abs(Number(c.dataset.rate) - r) < 0.001)));
    applyRate();
    refreshTimes();
    if (state.loaded && audio.duration > 0) setProgress(state.loaded, audio.currentTime / audio.duration);
  }

  function setVoice(v) {
    state.voice = v;
    store.set("voice", v);
    document.querySelectorAll(".vchip[data-voice]").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.voice === v)));
    refreshTimes();
    if (state.playing) play(state.idx[state.tab]);
    else if (state.loaded) setProgress(state.loaded, 0);
  }
  const vbox = $("voices");
  VOICES.forEach((v) => {
    const c = document.createElement("button");
    c.type = "button";
    c.className = "vchip";
    c.dataset.voice = v.id;
    c.textContent = v.label;
    c.addEventListener("click", () => setVoice(v.id));
    vbox.appendChild(c);
  });
  $("voices-row").hidden = VOICES.length < 2;

  function setTab(tab) {
    if (state.playing) pause();
    state.tab = tab;
    store.set("tab", tab);
    const isTalk = tab !== "chair";
    if (isTalk) store.set("version", tab);
    document.body.dataset.tab = isTalk ? "talk" : "chair";
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.tab === (isTalk ? "talk" : "chair"))));
    PANELS.forEach((p) => { $("lyrics-" + p).hidden = p !== tab; });
    $("version-row").hidden = !isTalk;
    document.querySelectorAll(".vchip[data-ver]").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.ver === tab)));
    $("kn-legend").hidden = tab !== "keynote";
    if (history.replaceState) history.replaceState(null, "", "#" + tab);
    state.follow = true;
    $("follow").hidden = true;
    setCurrent(state.idx[tab], false);
    updateUI();
    window.scrollTo({ top: 0 });
  }

  document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
    setTab(t.dataset.tab === "chair" ? "chair" : (store.get("version", "talk") === "keynote" ? "keynote" : "talk"));
  }));
  document.querySelectorAll(".vchip[data-ver]").forEach((c) => c.addEventListener("click", () => setTab(c.dataset.ver)));
  PANELS.forEach((tab) => {
    $("lyrics-" + tab).addEventListener("click", (e) => {
      const lineEl = e.target.closest(".line");
      if (!lineEl) return;
      if (window.getSelection && String(window.getSelection()).length > 0) return;
      const i = Number(lineEl.dataset.i);
      state.follow = true;
      $("follow").hidden = true;
      if (e.target.closest(".mplay") && i === state.idx[tab]) { toggle(); return; }
      play(i);
    });
  });
  $("play").addEventListener("click", toggle);
  $("prev").addEventListener("click", () => step(-1));
  $("next").addEventListener("click", () => step(1));
  document.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => setRate(Number(c.dataset.rate))));
  $("rate").addEventListener("input", (e) => setRate(Number(e.target.value)));
  $("gear").addEventListener("click", () => {
    const open = $("opts").hidden;
    $("opts").hidden = !open;
    $("gear").setAttribute("aria-expanded", String(open));
    measureBar();
  });
  $("gap").value = state.gap;
  $("gap").addEventListener("change", (e) => { state.gap = e.target.value; store.set("gap", state.gap); });
  function bindToggle(id, key) {
    const b = $(id);
    b.setAttribute("aria-pressed", String(state[key]));
    b.addEventListener("click", () => {
      state[key] = !state[key];
      store.set(key, state[key]);
      b.setAttribute("aria-pressed", String(state[key]));
    });
  }
  bindToggle("cont", "cont");
  bindToggle("loop", "loop");

  $("follow").addEventListener("click", () => {
    state.follow = true;
    $("follow").hidden = true;
    scrollToCurrent();
  });
  const userScrolled = () => {
    if (performance.now() < progScrollUntil || !state.playing) return;
    state.follow = false;
    $("follow").hidden = false;
  };
  window.addEventListener("wheel", userScrolled, { passive: true });
  window.addEventListener("touchmove", userScrolled, { passive: true });

  document.addEventListener("keydown", (e) => {
    if (e.target.closest && e.target.closest("input, select, textarea")) return;
    if (e.code === "Space") {
      if (e.target.closest && e.target.closest("button")) return;
      e.preventDefault();
      toggle();
    } else if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setRate(state.rate + 0.05); }
    else if (e.key === "ArrowDown") { e.preventDefault(); setRate(state.rate - 0.05); }
  });

  function measureBar() {
    document.documentElement.style.setProperty("--barH", $("bar").offsetHeight + "px");
  }
  if ("ResizeObserver" in window) new ResizeObserver(measureBar).observe($("bar"));
  measureBar();

  setRate(state.rate);
  setVoice(state.voice);
  setTab(state.tab);
})();
</script>

</body>
</html>
